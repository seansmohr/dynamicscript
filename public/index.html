<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohr Insurance — Dynamic Sales Script</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231d4ed8%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2246%22%20font-family%3D%22Helvetica%2CArial%2Csans-serif%22%20font-size%3D%2240%22%20font-weight%3D%22700%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3EM%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel-2:#fbfcfe; --ink:#12161f; --ink-2:#48526b;
  --ink-3:#7d879f; --line:#e2e7f0; --line-2:#ccd4e4;
  --brand:#1d4ed8; --brand-ink:#ffffff; --brand-soft:#e8efff; --brand-line:#bfd2ff;
  --say:#0b2f6b; --say-bg:#f0f5ff; --say-line:#1d4ed8;
  --do-bg:#fff8e8; --do-line:#e0a02a; --do-ink:#7a4d05;
  --warn-bg:#fdeeee; --warn-line:#d13b3b; --warn-ink:#8c1f1f;
  --ok:#0e7c53; --ok-bg:#e7f7ef; --ok-line:#0e7c53;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --radius:12px;
  --ui:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --read:"Source Serif 4",Charter,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#161b25; --panel-2:#1b212d; --ink:#eef2f8; --ink-2:#aab4c8;
    --ink-3:#7c88a0; --line:#28303e; --line-2:#38424f;
    --brand-line:#2c4478;
    --say:#dce8ff; --say-bg:#141d31; --say-line:#5b8cff;
    --do-bg:#2a2312; --do-line:#c99429; --do-ink:#f0d69a;
    --warn-bg:#2e1618; --warn-line:#e05c5c; --warn-ink:#ffc9c9;
    --ok:#4ad498; --ok-bg:#12271f; --ok-line:#2f8f66;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b25; --panel-2:#1b212d; --ink:#eef2f8; --ink-2:#aab4c8;
  --ink-3:#7c88a0; --line:#28303e; --line-2:#38424f;
  --brand:#5b8cff; --brand-ink:#0b1220; --brand-soft:#17233d; --brand-line:#2c4478;
  --say:#dce8ff; --say-bg:#141d31; --say-line:#5b8cff;
  --do-bg:#2a2312; --do-line:#c99429; --do-ink:#f0d69a;
  --warn-bg:#2e1618; --warn-line:#e05c5c; --warn-ink:#ffc9c9;
  --ok:#4ad498; --ok-bg:#12271f; --ok-line:#2f8f66;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.55 var(--ui);
  font-feature-settings:"cv05" 1;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--panel);
  border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.topbar-in{max-width:1500px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand .mark{
  width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;font-size:14px;font-weight:800
}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;text-transform:uppercase}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand);
  font-size:13px;font-weight:650;white-space:nowrap
}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.tbtn{
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;
  font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer
}
.tbtn:hover{border-color:var(--brand);color:var(--brand)}

/* section stepper */
.steps-rail{max-width:1500px;margin:0 auto;padding:0 18px 10px;display:flex;gap:6px;flex-wrap:wrap}
.srail{
  display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;
  font-weight:600;color:var(--ink-3);background:transparent;border:1px solid transparent;cursor:pointer
}
.srail .n{
  width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:var(--line);color:var(--ink-3);font-weight:700
}
.srail.done{color:var(--ok)} .srail.done .n{background:var(--ok-bg);color:var(--ok)}
.srail.cur{color:var(--brand);background:var(--brand-soft);border-color:var(--brand-line)}
.srail.cur .n{background:var(--brand);color:var(--brand-ink)}
.srail.na{opacity:.35;text-decoration:line-through;cursor:default}
.pbar{height:3px;background:var(--line)}
.pbar>i{display:block;height:100%;background:var(--brand);transition:width .25s ease}

/* ---------- layout ---------- */
.layout{max-width:1500px;margin:0 auto;padding:20px 18px 80px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1080px){.layout{grid-template-columns:minmax(0,1fr)}}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.stage-head{padding:20px 26px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.sec-label{font-size:11.5px;font-weight:750;letter-spacing:.10em;text-transform:uppercase;color:var(--brand)}
.stage-head h1{margin:5px 0 0;font-size:24px;line-height:1.22;letter-spacing:-.025em;font-weight:750;text-wrap:balance}
.stage-head .sub{margin-top:6px;font-size:13.5px;color:var(--ink-3)}
.blocks{padding:22px 26px}

/* blocks */
.b{margin:0 0 16px}
.b:last-child{margin-bottom:0}
.say{
  background:var(--say-bg);border-left:4px solid var(--say-line);border-radius:0 10px 10px 0;
  padding:16px 20px;color:var(--say);font-family:var(--read);font-size:19.5px;line-height:1.58;
  letter-spacing:-.003em;max-width:66ch
}
.say + .say{margin-top:-6px}
.say .q{font-weight:700}
.do{
  display:flex;gap:10px;background:var(--do-bg);border-left:4px solid var(--do-line);border-radius:0 10px 10px 0;
  padding:11px 15px;color:var(--do-ink);font-size:14.5px;font-style:italic
}
.do .ic{font-style:normal;flex:none}
.warn{
  display:flex;gap:10px;background:var(--warn-bg);border-left:4px solid var(--warn-line);border-radius:0 10px 10px 0;
  padding:12px 15px;color:var(--warn-ink);font-size:14.5px;font-weight:550
}
.warn .ic{flex:none}
.info{
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px 16px;
  font-size:14.5px;color:var(--ink-2)
}
.info b,.warn b,.do b{color:inherit}
.bul{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.bul h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.bul ul{margin:0;padding-left:20px}
.bul li{margin:5px 0;font-size:16.5px;font-family:var(--read)}
.ph{
  background:var(--do-bg);color:var(--do-ink);border-bottom:2px dotted var(--do-line);
  padding:0 3px;margin:0 -1px;border-radius:3px;font-style:italic;font-size:.94em
}
.fill{font-weight:750;color:var(--brand);background:var(--brand-soft);padding:0 3px;margin:0 -1px;border-radius:4px}

/* inputs */
.frow{display:flex;gap:12px;flex-wrap:wrap}
.f{flex:1 1 200px;min-width:0}
.f.sm{flex:0 1 140px}.f.md{flex:0 1 240px}.f.lg{flex:1 1 100%}
.f label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 0 5px;letter-spacing:.01em}
.f input,.f select,.f textarea{
  width:100%;background:var(--panel);border:1.5px solid var(--line-2);border-radius:9px;padding:10px 12px;
  font-size:15.5px;outline:none;transition:border-color .12s,box-shadow .12s
}
.f textarea{min-height:78px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.f .hint{font-size:12px;color:var(--ink-3);margin-top:4px;min-height:1px}
.f input.bad{border-color:var(--warn-line);background:var(--warn-bg)}
.f input.bad:focus{border-color:var(--warn-line);box-shadow:0 0 0 3px rgba(209,59,59,.16)}
.f .hint.bad{color:var(--warn-ink);font-weight:650}
.f input[data-mdy]{font-variant-numeric:tabular-nums;letter-spacing:.04em}

.choice{margin:0}
.choice > .clab{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 0 8px}
.opts{display:flex;gap:9px;flex-wrap:wrap}
.opt{
  display:inline-flex;align-items:center;gap:9px;padding:10px 15px;border-radius:10px;cursor:pointer;
  background:var(--panel);border:1.5px solid var(--line-2);font-size:15px;font-weight:600;color:var(--ink-2);
  transition:all .12s
}
.opt:hover{border-color:var(--brand)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.opt.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.opt.on .box{border-color:var(--brand)}
.opt.on .box::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.opt .sub{font-weight:500;font-size:12.5px;color:var(--ink-3);display:block}

/* goals */
.goals .g{
  display:flex;align-items:flex-start;gap:10px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin-bottom:8px
}
.goals .g .num{
  width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-top:1px
}
.goals .g .txt{flex:1;font-size:15.5px}
.goals .g .x{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.goals .g .x:hover{color:var(--warn-line)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.btn{
  background:var(--brand);color:var(--brand-ink);border:none;border-radius:9px;padding:10px 18px;
  font-size:15px;font-weight:700;cursor:pointer
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);color:var(--ink-2);border:1.5px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand);filter:none}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* umbrella + pricing widgets */
.umb{border:1.5px solid var(--brand-line);border-radius:12px;overflow:hidden;background:var(--panel)}
.umb-h{padding:11px 16px;background:var(--brand-soft);border-bottom:1px solid var(--brand-line);
  font-size:12.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.umb-b{padding:14px 16px}
.utab{width:100%;border-collapse:collapse;font-size:14.5px}
.utab td{padding:7px 0;border-bottom:1px solid var(--line)}
.utab td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.kv .v,.big{font-variant-numeric:tabular-nums}
.utab tr.off{color:var(--ink-3)}
.utab tr.off td:last-child{font-weight:500}
.utab tr.tot td{border-bottom:none;padding-top:11px;font-size:17px;font-weight:800;color:var(--brand)}
.ucols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.ucols{grid-template-columns:1fr}}
.ucol{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel-2)}
.ucol h5{margin:0 0 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--brand);font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:600;color:var(--ink-3)}

/* nav */
.nav{
  display:flex;align-items:center;gap:12px;padding:16px 26px;border-top:1px solid var(--line);
  background:var(--panel-2);position:sticky;bottom:0
}
.nav .count{flex:1;text-align:center;font-size:13px;color:var(--ink-3);font-weight:600}

/* rail */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:104px}
@media (max-width:1080px){.rail{position:static}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card h3{
  margin:0;padding:11px 15px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;align-items:center;gap:7px
}
.card .body{padding:13px 15px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3);font-size:13px;flex:none}
.kv .v{font-weight:650;text-align:right;word-break:break-word}
.kv .v.dim{font-weight:400;color:var(--ink-3);font-style:italic}
.empty{color:var(--ink-3);font-style:italic;font-size:13.5px}
.railgoal{display:flex;gap:8px;padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.railgoal:last-child{border-bottom:none}
.railgoal .n{color:var(--brand);font-weight:700;flex:none}
.card textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;min-height:110px;
  background:var(--panel);font-size:13.5px;resize:vertical;outline:none;line-height:1.5}
.card textarea:focus{border-color:var(--brand)}
.flagrow{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--warn-ink);
  background:var(--warn-bg);border-left:3px solid var(--warn-line);border-radius:0 8px 8px 0;padding:8px 11px;margin-bottom:8px}

/* compliance stop */
.stopcard{border:2px solid var(--warn-line);border-radius:12px;overflow:hidden;background:var(--panel)}
.stopcard-h{padding:11px 16px;background:var(--warn-bg);border-bottom:1px solid var(--warn-line);
  font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink)}
.stopcard-b{padding:14px 16px;font-size:15px;color:var(--ink)}
.stopcard-b p{margin:0 0 8px}.stopcard-b p:last-child{margin-bottom:0}
.stopcard-b .fine{font-size:13px;color:var(--ink-3)}
.railstop{border:1.5px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);
  border-radius:9px;padding:10px 12px;font-size:13px;font-weight:600}

/* summary */
.sum h2{font-size:17px;margin:22px 0 8px;letter-spacing:-.01em;padding-bottom:5px;border-bottom:2px solid var(--line)}
.sum h2:first-child{margin-top:0}
.sumtab{width:100%;border-collapse:collapse;font-size:14.5px}
.sumtab td{padding:6px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.sumtab td:first-child{width:200px;color:var(--ink-3);font-size:13px;padding-right:14px}
pre.out{
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px;
  line-height:1.55;white-space:pre-wrap;max-height:340px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;
  pointer-events:none;transition:all .2s;z-index:99
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .topbar,.rail,.nav,.steps-rail,.pbar{display:none!important}
  .layout{display:block;padding:0}
  .stage{border:none;box-shadow:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="mark">M</span><span>Mohr Insurance<small>Dynamic Sales Script</small></span></div>
    <span class="chip" id="avatarChip"><span class="dot"></span><span id="avatarText">Determining avatar…</span></span>
    <span class="spacer"></span>
    <button class="tbtn" id="btnTheme" title="Toggle light / dark">Theme</button>
    <button class="tbtn" id="btnSummary">Call summary</button>
    <button class="tbtn" id="btnReset">New call</button>
  </div>
  <div class="steps-rail" id="stepsRail"></div>
  <div class="pbar"><i id="pbar" style="width:0%"></i></div>
</div>

<div class="layout">
  <section class="stage">
    <div class="stage-head">
      <span class="sec-label" id="secLabel"></span>
      <h1 id="stepTitle"></h1>
      <div class="sub" id="stepSub"></div>
    </div>
    <div class="blocks" id="blocks"></div>
    <div class="nav">
      <button class="btn ghost" id="btnBack">← Back</button>
      <span class="count" id="stepCount"></span>
      <button class="btn" id="btnNext">Next →</button>
    </div>
  </section>

  <aside class="rail">
    <div class="card">
      <h3>Client snapshot</h3>
      <div class="body" id="railClient"></div>
    </div>
    <div class="card">
      <h3>Umbrella builder</h3>
      <div class="body" id="railUmbrella"></div>
    </div>
    <div class="card">
      <h3>Goals for today</h3>
      <div class="body" id="railGoals"></div>
    </div>
    <div class="card">
      <h3>Agent notes</h3>
      <div class="body"><textarea id="scratch" placeholder="Anything worth remembering for the read-back…"></textarea></div>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";

/* ============================================================
   STATE
   ============================================================ */
const BLANK = {
  a:{},              // every answer, keyed
  goals:[],          // captured goals from the opening
  scratch:"",        // free-form agent notes
  step:0,
  started:new Date().toISOString()
};
let S = load();

function load(){
  try{
    const raw = localStorage.getItem("mohr.script.v1");
    if(raw){
      const st = Object.assign(structuredClone(BLANK), JSON.parse(raw));
      /* calls saved before dates were typed still hold the picker's ISO value */
      ["dob","effectiveDate"].forEach(k=>{
        const v = st.a && st.a[k];
        if(typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v))
          st.a[k] = v.slice(5,7)+"/"+v.slice(8,10)+"/"+v.slice(0,4);
      });
      return st;
    }
  }catch(e){}
  return structuredClone(BLANK);
}
function save(){
  try{ localStorage.setItem("mohr.script.v1", JSON.stringify(S)); }catch(e){}
}
const A = k => (S.a[k] ?? "");
function set(k,v){ S.a[k]=v; save(); }

/* ============================================================
   DERIVED — avatar, age, state, compliance
   ============================================================ */

/* The v5 script exits to the employer track at the work-status question,
   before coverage source is ever asked — so the employer route is decided
   by "still working" plus "over 20 employees", nothing else. */
function hasEmployerJob(){ return ["working","partTime"].includes(A("workStatus")); }
function employerIsLarge(){ return A("employerSize")==="over20"; }

function avatar(){
  if(A("avatarOverride")) return A("avatarOverride");
  if(A("onMedicare")==="yes") return "medicare";
  if(hasEmployerJob() && employerIsLarge()) return "employer";
  if(A("ssStatus")==="yes") return "t65ss";
  if(A("ssStatus")==="no")  return "t65noss";
  return "";
}
const AVATARS = {
  employer:{label:"Employer coverage", short:"Employer", track:"Delay Medicare + Gold / Silver / Bronze"},

/* ---- typed dates -------------------------------------------------------
   The agent types digits and the slashes appear on their own: 03141961
   becomes 03/14/1961. Dates are stored as MM/DD/YYYY and parsed field by
   field — never through new Date("1961-03-14"), which resolves to UTC
   midnight and reads back as the previous day in every US time zone.     */
const DATE_RULES = {
  dob:           {label:"Date of birth",  minYear:1900, maxYear:()=>new Date().getFullYear(), allowFuture:false},
  effectiveDate: {label:"Effective date", minYear:()=>new Date().getFullYear()-1, maxYear:()=>new Date().getFullYear()+10, allowFuture:true}
};
const ruleFor = k => DATE_RULES[k] || DATE_RULES.dob;
const ruleVal = v => typeof v==="function" ? v() : v;

function digitsOf(v){ return String(v||"").replace(/\D/g,"").slice(0,8); }

/* Turn whatever is in the box into the eight digits it means. A separator —
   typed or pasted — closes the group before it, so "3/14/1961" is March 14
   rather than the 31st of month 41. */
function normalizeTyped(raw){
  raw = String(raw||"").trim().replace(/[.\-\s]/g,"/");
  if(!raw.includes("/")) return digitsOf(raw);
  const segs = raw.split("/").map(x=>x.replace(/\D/g,""));
  if(segs.length===3 && segs[0].length===4)                    // pasted 1961-03-14
    return (segs[1].padStart(2,"0")+segs[2].padStart(2,"0")+segs[0]).slice(0,8);
  let out = "";
  segs.forEach((seg,i)=>{
    /* pad a short group, but never truncate a long one — an overflowing edit
       should push into the year and show up red, not vanish silently */
    out += (i<2 && i<segs.length-1) ? seg.padStart(2,"0") : seg;
  });
  return out.slice(0,8);
}

/* Insert the separators. `trailing` adds the slash the moment a group is
   complete; it is switched off while deleting so backspace never re-adds
   the slash it just removed. */
function formatMDY(d, trailing){
  let out = d.slice(0,2);
  if(d.length>2 || (trailing && d.length===2)) out += "/";
  if(d.length>2) out += d.slice(2,4);
  if(d.length>4 || (trailing && d.length===4)) out += "/";
  if(d.length>4) out += d.slice(4,8);
  return out;
}
/* Accepts MM/DD/YYYY and the ISO form left behind by the old date picker. */
function parseMDY(v){
  const raw = String(v||"").trim();
  if(!raw) return null;
  let mo,da,yr;
  const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso){ yr=+iso[1]; mo=+iso[2]; da=+iso[3]; }
  else {
    const d = digitsOf(raw);
    if(d.length!==8) return null;             // four-digit year required
    mo=+d.slice(0,2); da=+d.slice(2,4); yr=+d.slice(4,8);
  }
  if(mo<1||mo>12||da<1||da>31) return null;
  const dt = new Date(yr, mo-1, da);
  if(dt.getFullYear()!==yr || dt.getMonth()!==mo-1 || dt.getDate()!==da) return null; // e.g. 02/30
  return dt;
}
function displayMDY(v){
  const d = parseMDY(v);
  if(!d) return String(v||"");
  const p = n => String(n).padStart(2,"0");
  return p(d.getMonth()+1)+"/"+p(d.getDate())+"/"+d.getFullYear();
}
/* What the agent should be told about what they have typed so far. */
function dateStatus(k){
  const raw = String(A(k)||"");
  if(!raw.trim()) return {state:"empty", msg:""};
  const r = ruleFor(k);
  const d = parseMDY(raw);
  if(!d){
    const n = digitsOf(raw).length;
    if(n<8) return {state:"incomplete", msg:"Keep going — mm/dd/yyyy, four-digit year."};
    return {state:"invalid", msg:"That isn't a real date."};
  }
  const today = new Date(); today.setHours(0,0,0,0);
  if(!r.allowFuture && d>today) return {state:"invalid", msg:r.label+" can't be in the future."};
  const min = ruleVal(r.minYear), max = ruleVal(r.maxYear);
  if(d.getFullYear()<min || d.getFullYear()>max)
    return {state:"invalid", msg:"Year should be between "+min+" and "+max+"."};
  return {state:"ok", msg:""};
}
const dobDate = () => dateStatus("dob").state==="ok" ? parseMDY(A("dob")) : null;

function age(){
  const b = dobDate(); if(!b) return null;
  const n = new Date();
  let y = n.getFullYear()-b.getFullYear();
  const m = n.getMonth()-b.getMonth();
  if(m<0 || (m===0 && n.getDate()<b.getDate())) y--;
  return y;
}
function monthsTo65(){
  const b = dobDate(); if(!b) return null;
  const n = new Date();
  return ((b.getFullYear()+65)-n.getFullYear())*12 + (b.getMonth()-n.getMonth());
}
function birthMonthName(){
  const b = dobDate(); if(!b) return "";
  return ["January","February","March","April","May","June","July",
          "August","September","October","November","December"][b.getMonth()];
}

/* ---- California ancillary rule ----------------------------------------
   65 or older in California means no ancillary product may be pitched —
   no umbrella, no Gold / Silver / Bronze. California zips run 90001–96162,
   so the 900–961 prefix identifies the state on its own. Every other state
   is left blank because no other state changes what can be sold.          */
function stateFromZip(z){
  const n = parseInt(String(z||"").replace(/\D/g,"").slice(0,3),10);
  if(!isFinite(n)) return "";
  return (n>=900 && n<=961) ? "CA" : "";
}
function clientState(){
  const manual = String(A("stateManual")||"").trim().toUpperCase();
  return manual || stateFromZip(A("zip"));
}
function caRestricted(){
  const a = age();
  return clientState()==="CA" && a!==null && a>=65;
}
const CA_RULE = "65 or older in California — cancer/heart attack/stroke and skilled nursing coverage cannot be sold. Dental still can.";
/* What the restriction actually removes. Dental is unaffected, so the dental
   question is still asked and still prices the Supplement umbrella. */
const BLOCKED_KEYS = ["chsConcern","snfConcern"];
const isBlockedKey = k => caRestricted() && BLOCKED_KEYS.includes(k);

/* Live advisories the agent should see. */
function flags(){
  const out=[];
  if(caRestricted()) out.push("<b>California, age "+age()+".</b> "+CA_RULE+" The CHS and skilled nursing exposure conversations are skipped.");
  if(A("makesDecisions")==="no")
    out.push("They do not make their own healthcare decisions — an authorized representative or POA must be on the line before you present anything.");
  if(A("soa")==="no")
    out.push("No Scope of Appointment on record. You cannot discuss MA, Med Supp, PDP or ancillary products until you have a clear verbal yes.");
  if(hasEmployerJob() && A("employerSize")==="under20")
    out.push("Employer has 20 or fewer employees — they must transition to Medicare, so the call continues through the full needs assessment on the T65 track.");
  if(isEmployerTrack() && A("empCoverageIsEmployer")==="no")
    out.push("Their plan is not actually through the employer — the delay recommendation assumes creditable employer coverage. Verify before recommending a delay.");
  if(A("onMedicare")==="notsure")
    out.push("Client is unsure whether they have Parts A & B — verify on their red-white-and-blue card before going any further.");
  return out;
}

/* ============================================================
   UMBRELLA ENGINE
   Med Supp : cancer $50 + skilled nursing $50 + dental $50  (max $150)
   Med Adv  : cancer $50 + skilled nursing $100             (max $150)
   MA already bundles dental, so dental adds nothing there.
   The California rule zeroes both outright — no override.
   ============================================================ */
const UMB = {
  supp:[
    {k:"chsConcern",   amt:50,  label:"Cancer / heart attack / stroke", why:"CHS is a concern"},
    {k:"snfConcern",   amt:50,  label:"Skilled nursing",                why:"Skilled nursing is a concern"},
    {k:"dentalImport", amt:50,  label:"Dental",                         why:"Dental is important to them"}
  ],
  ma:[
    {k:"chsConcern",   amt:50,  label:"Cancer / heart attack / stroke", why:"CHS is a concern"},
    {k:"snfConcern",   amt:100, label:"Skilled nursing",                why:"Skilled nursing is a concern"},
    {k:"dentalImport", amt:0,   label:"Dental", note:"included with the Advantage plan", why:"Dental already bundled"}
  ]
};
function umbrellaCalc(kind){
  const rows = UMB[kind].map(r => {
    const blocked = isBlockedKey(r.k);
    return {...r, blocked, on: !blocked && A(r.k)==="yes"};
  });
  const raw  = rows.reduce((n,r)=> n + (r.on ? r.amt : 0), 0);
  return { rows, raw, total: Math.min(raw,150), capped: raw>150 };
}
function umbrella(kind){
  const calc = umbrellaCalc(kind);
  /* No override while restricted — the only component left is dental, and an
     override is exactly how the blocked components would creep back in. */
  if(caRestricted()) return { ...calc, value:calc.total, overridden:false, restricted:true };
  const o = A(kind==="supp" ? "umbSuppOverride" : "umbMaOverride");
  const n = o===""||o==null ? calc.total : Number(o);
  return { ...calc, value:(isFinite(n)?n:calc.total), overridden:!(o===""||o==null), restricted:false };
}
const money = n => "$" + (Math.round(Number(n)||0)).toLocaleString();
const num   = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:0; };

function suppTotal(){ return num(A("planGPremium")) + num(A("partDPremium")||10) + umbrella("supp").value; }
function maTotal(){   return num(A("mapdPremium")||0) + umbrella("ma").value; }

function recommendedPlanLabel(){
  const l = A("leaning");
  return l==="supp" ? "Medicare Supplement (Plan G)" : l==="ma" ? "Medicare Advantage (Part C)" : "";
}
function recommendedTotal(){
  const l = A("leaning");
  return l==="supp" ? suppTotal() : l==="ma" ? maTotal() : 0;
}
function recommendedUmbrella(){
  const l = A("leaning");
  return l==="ma" ? umbrella("ma").value : umbrella("supp").value;
}

/* ============================================================
   TEXT INTERPOLATION
   {key} pulls from state; when empty it renders as a highlighted blank
   so the agent can see at a glance what they still have to fill in.
   ============================================================ */
const TOKENS = {
  name:        ()=> A("clientFirst") || A("clientName"),
  fullName:    ()=> A("clientName"),
  agent:       ()=> A("agentName"),
  carrier:     ()=> A("carrier"),
  zip:         ()=> A("zip"),
  moop:        ()=> A("maxOOP") ? money(num(A("maxOOP"))) : "",
  deductible:  ()=> A("deductible") ? money(num(A("deductible"))) : "",
  premium:     ()=> A("currentPremium") ? money(num(A("currentPremium"))) : "",
  birthMonth:  ()=> birthMonthName(),
  planType:    ()=> recommendedPlanLabel(),
  planShort:   ()=> A("leaning")==="supp" ? "Supplement" : A("leaning")==="ma" ? "Advantage" : "",
  leadTime:    ()=> A("leaning")==="supp" ? "6 months" : A("leaning")==="ma" ? "3 months" : "",
  umbPrice:    ()=> A("leaning") ? money(recommendedUmbrella()) : "",
  planTotal:   ()=> A("leaning") ? money(recommendedTotal()) : "",
  suppTotal:   ()=> money(suppTotal()),
  maTotal:     ()=> money(maTotal()),
  effDate:     ()=> A("effectiveDate"),
  currentPlan: ()=> A("currentMedPlanCarrier")
};
const LABELS = {
  name:"first name", fullName:"client name", agent:"agent name", carrier:"carrier", zip:"zip",
  moop:"max out of pocket", deductible:"deductible", premium:"premium", birthMonth:"birth month",
  planType:"plan they're leaning toward", planShort:"Supplement/Advantage", leadTime:"6 / 3 months",
  umbPrice:"umbrella price", planTotal:"monthly total", suppTotal:"supplement total", maTotal:"advantage total",
  effDate:"effective date", currentPlan:"current plan"
};
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fill(text){
  return String(text).replace(/\{(\w+)\}/g,(m,k)=>{
    const v = TOKENS[k] ? TOKENS[k]() : "";
    if(v) return '<span class="fill">'+esc(v)+"</span>";
    return '<span class="ph">['+(LABELS[k]||k)+"]</span>";
  });
}
/* plain-text version for the exportable summary */
function fillPlain(text){
  return String(text).replace(/\{(\w+)\}/g,(m,k)=>{
    const v = TOKENS[k] ? TOKENS[k]() : "";
    return v || "["+(LABELS[k]||k)+"]";
  });
}

    {t:"say", text:"Okay, and are you taking any prescriptions right now, and what are they actively treating?"},
    {t:"field", k:"prescriptions", label:"Prescriptions & what they treat", type:"textarea",
      ph:"Drug name — dosage — what it treats", w:"lg"}
  ]},

{ id:"cna-dental", sec:"CNA", title:"Dental importance",
  sub:"Umbrella driver — a yes here adds $50 to the Medicare Supplement umbrella.",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"My next question would be, is dental insurance important to you, and do you currently have that with your employer or through the marketplace?"},
    {t:"choice", k:"dentalImport", label:"Is dental important to them?", opts:[
      {v:"yes", l:"Yes — it matters to them", sub:"+$50 Supplement umbrella"},
      {v:"no",  l:"No — not a priority",      sub:"No umbrella impact"}
    ]},
    {t:"field", k:"dentalNow", label:"Do they have dental today, and where?", ph:"Employer, marketplace, standalone, none…", w:"lg"},
    {t:"info", if:()=>!caRestricted(), text:"Dental only prices into the <b>Supplement</b> umbrella. A Medicare Advantage plan already bundles dental, so it adds nothing on that side."},
    {t:"cablock"},
    {t:"umbrella", if:()=>caRestricted()}
  ]},

{ id:"cna-exposures", sec:"CNA", title:"Major exposures — the set-up",
  skip:()=> !isT65() || caRestricted(),
  blocks:[
    {t:"say", text:"Now, in that webinar do you remember how we highlight major exposures?"},
    {t:"do", text:"Wait for the response."},
    {t:"say", text:"Major exposures can really stem from any plan — whether it's your current plan with {carrier}, or a Medicare Supplement or Advantage plan — but really in relation to two specific things."},
    {t:"do", text:"Do not rush the next two steps. Everything you price later comes out of these two answers."}
  ]},

{ id:"cna-chs", sec:"CNA", title:"Cancer, heart attack, stroke",
  sub:"Umbrella driver — a yes here adds $50 to both umbrellas.",
  skip:()=> !isT65() || caRestricted(),
  blocks:[
    {t:"say", text:"For starters — cancer, heart attack, stroke. Do we have any personal or family history with the big three?"},
    {t:"field", k:"chsHistory", label:"Personal / family history with the big three", type:"textarea",
      ph:"Who, what, when — use their own words back to them later.", w:"lg"},
    {t:"say", text:"I really appreciate you sharing that with me… and the reason we bring this up — I'll share a personal note. My grandmother had cancer three times, and she was on Medicare and had great coverage, but even with that coverage she had to pay <b>$15,000</b> out of her own pocket for non-approved expenses."},
    {t:"say", text:"<span class='q'>Is something like that going to be a concern for you?</span>"},
    {t:"do", text:"Wait for the response. Let the silence sit."},
    {t:"choice", k:"chsConcern", label:"Is CHS a concern for them?", opts:[
      {v:"yes", l:"Yes — it's a concern", sub:"+$50 to both umbrellas"},
      {v:"no",  l:"No",                   sub:"No umbrella impact"}
    ]}
  ]},

{ id:"cna-snf", sec:"CNA", title:"Skilled nursing",
  sub:"Umbrella driver — a yes here adds $50 to the Supplement umbrella and $100 to the Advantage umbrella.",
  skip:()=> !isT65() || caRestricted(),
  blocks:[
    {t:"say", text:"Now the next big exposure we see is skilled nursing. Do you have any personal or family history with that, and are you familiar with how that coverage functions with Medicare?"},
    {t:"field", k:"snfHistory", label:"Skilled nursing history / familiarity", type:"textarea",
      ph:"Their experience and how much they already understand.", w:"lg"},
    {t:"say", text:"Medicare will help cover up to day 100 as long as you had a <b>3 day hospital stay</b> and are <b>showing signs of improvement</b>… but after day 100 you are responsible for all costs. And it's really important we focus on that 3 day hospital stay and showing signs of improvement."},
    {t:"say", text:"I had a client who was in skilled nursing for ten days and her insurance plan, Kaiser, said she was not improving and doing the exercises because she had a stroke — so they ended her care and she had to go home and pay <b>$20,000</b> out of pocket for home care. So I'm assuming this will be a concern as well?"},
    {t:"do", text:"Wait for the response."},
    {t:"choice", k:"snfConcern", label:"Is skilled nursing a concern for them?", opts:[
      {v:"yes", l:"Yes — it's a concern", sub:"+$50 Supplement · +$100 Advantage"},
      {v:"no",  l:"No",                   sub:"No umbrella impact"}
    ]},
    {t:"say", text:"And yeah, we'll come back to that in greater detail, but I really just wanted to make sure you're aware of these exposures."},
    {t:"umbrella"}
  ]},

{ id:"cna-partb", sec:"CNA", title:"Part B premium — income qualification",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"Now, when you transition to Medicare you'll be responsible for a Part B premium — however that premium is going to be very dependent on your household income. Do you know where that's at at this moment in time?"},
    {t:"field", k:"income", label:"Household income", ph:"$", w:"md"},
    {t:"say", text:"And has that been pretty consistent over the last two years?"},
    {t:"choice", k:"incomeConsistent", label:"Consistent over 2 years?", opts:[
      {v:"yes",l:"Yes"},{v:"no",l:"No — it's changed"},{v:"unsure",l:"Not sure"}
    ]},
    {t:"say", text:"And the reason I ask is they always look back two years prior."},
    {t:"field", k:"incomeNotes", label:"Notes", ph:"Life-changing event? IRMAA appeal worth flagging?", w:"lg"}
  ]},

{ id:"cna-retirement", sec:"CNA", title:"Retirement assets",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"And another thing that can impact your Part B premium, which not a lot of people think about — do you have any retirement accounts that have over $200,000 in qualified assets or more?"},
    {t:"choice", k:"assets200k", label:"Over $200,000 in qualified assets?", opts:[
      {v:"yes",l:"Yes"},{v:"no",l:"No"},{v:"declined",l:"Wouldn't say"}
    ]},
    {t:"say", text:"And the reason I ask is because when we plan to supplement our income with the money within those accounts, that can impact your Part B premium. Have you had the chance to talk to a retirement specialist yet?"},
    {t:"choice", k:"retirementSpecialist", label:"Talked to a retirement specialist?", opts:YN},
    {t:"say", if:()=>A("retirementSpecialist")==="no",
      text:"Okay, well we have a full partnership on hand, so if you ever want to sit down and have that conversation it is a service we offer <b>free of charge</b>, and we can look at getting you scheduled for that once we're done here — okay?"},
    {t:"choice", k:"retirementReferral", label:"Do they want the retirement appointment?", opts:[
      {v:"yes",l:"Yes — book it after the call"},{v:"maybe",l:"Maybe / later"},{v:"no",l:"No"}
    ]}
  ]},

{ id:"cna-close", sec:"CNA", title:"Close out the CNA",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"Awesome, that wraps up the needs assessment. Now we're going to walk through your options and answer the questions you had at the beginning."},
    {t:"avatarcard"}
  ]},

/* ================= 3. EDUCATION (EMPLOYER) — its own needs assessment ================= */
{ id:"emp-ss", sec:"CNA", title:"Employer track — Social Security status",
  sub:"Drawing Social Security changes both the delay recommendation and the L564 instructions.",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"Are you drawing Social Security yet?"},
    {t:"choice", k:"ssStatus", label:"Drawing Social Security?", opts:[
      {v:"yes", l:"Yes", sub:"Delay Part B only — Part A is automatic"},
      {v:"no",  l:"No",  sub:"Delay Part A and Part B entirely"}
    ]},
    {t:"warn", if:()=>A("ssStatus")==="yes",
      text:"<b>Take note.</b> They're drawing Social Security, so they will be automatically enrolled in Part A and will need to <b>request to delay Part B</b>."}
  ]},

{ id:"emp-coverage", sec:"CNA", title:"Employer track — carrier & plan",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"Tell me a little bit about your current health insurance — is that through your employer?"},
    {t:"choice", k:"empCoverageIsEmployer", label:"Coverage is through the employer?", opts:YN},
    {t:"warn", if:()=>A("empCoverageIsEmployer")==="no",
      text:"The delay recommendation rests on them having <b>creditable employer coverage</b>. If the plan isn't through the employer, find out what it actually is before you recommend delaying anything."},
    {t:"say", text:"What carrier is that with?"},
    {t:"say", text:"And is that an HMO… PPO?"},
    {t:"fields", items:[
      {k:"carrier",  label:"Carrier",  ph:"e.g. Blue Cross, Kaiser, Aetna", w:"md"},
      {k:"planType", label:"HMO / PPO / other", ph:"HMO, PPO, EPO, HDHP…",  w:"md"}
    ]}
  ]},

{ id:"emp-premium", sec:"CNA", title:"Employer track — monthly premium",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"What are you paying for that right now on a month to month basis?"},
    {t:"field", k:"currentPremium", label:"Current monthly premium", ph:"$", w:"sm"}
  ]},

{ id:"emp-moop", sec:"CNA", title:"Employer track — max out of pocket",
  sub:"This number is the entire basis of the Gold / Silver / Bronze pitch. Do not leave it blank.",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"And then you may not know this next part off the top of your head, but if you have your insurance card it should read off of there. What is your maximum out of pocket?"},
    {t:"field", k:"maxOOP", label:"Max out of pocket", ph:"$", w:"sm"},
    {t:"say", text:"Have you hit that max out of pocket, and if so what happened?"},
    {t:"field", k:"hitDeductible", label:"What happened", type:"textarea",
      ph:"Their story — you have no other exposure conversation on this track, so this is your material.", w:"lg"},
    {t:"do", text:"Get their commitment before you move on."},
    {t:"say", text:"Yeah, that makes sense. So I have all the information I need and have two recommendations for you."}
  ]},

{ id:"emp-delay", sec:"Education", title:"Recommendation #1 — delay Medicare",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", if:()=>A("ssStatus")!=="yes",
      text:"So right now this transition to Medicare does not make much sense for you, so my first recommendation would be to <b>delay Part A and Part B entirely.</b> You have a strong plan with your employer and your premiums are pretty low."},
    {t:"say", if:()=>A("ssStatus")==="yes",
      text:"So right now this transition to Medicare does not make much sense for you, so my first recommendation would be to <b>delay Part B entirely</b> — but you will be automatically enrolled in Part A, because you're drawing Social Security. You have a strong plan with your employer and your premiums are pretty low."},
    {t:"do", if:()=>!A("ssStatus"), text:"Answer the Social Security question a step back — it decides whether this is \"delay Part A and Part B\" or \"delay Part B only.\""},
    {t:"do", text:()=> "Their plan: <b>"+(A("carrier")||"[carrier]")+"</b> at <b>"+(A("currentPremium")?money(num(A("currentPremium"))):"[premium]")+"/mo</b>, max out of pocket <b>"+(A("maxOOP")?money(num(A("maxOOP"))):"[max OOP]")+"</b>."}
  ]},

{ id:"emp-penalty", sec:"Education", title:"Peace of mind on penalties",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"And I want to make sure you are at peace of mind with penalties, since that's always a big concern. <b>You won't be penalized for delaying Medicare</b> since you have creditable coverage with your employer. Are we clear on that?"},
    {t:"do", text:"Wait for the response. Do not move on without a yes."}
  ]},

{ id:"emp-l564", sec:"Education", title:"CMS L564 — the hall pass",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:()=>{
      const parts = A("ssStatus")==="yes" ? "<b>Part B</b>" : "<b>Part A and Part B</b>";
      return "Now when you do decide to retire, or you lose that creditable coverage, that's when you take action. That's when you take <b>CMS L564</b> — it's a form you'll take to your HR department and they'll help you fill it out. Then you'll take that form and you're gonna submit it along with your application for "+parts+". That form is basically your <b>hall pass that voids all penalties.</b> Are we clear on that?";
    }},
    {t:"do", text:"Wait for the response."},
    {t:"choice", k:"empUnderstands", label:"Confirmed they're clear on both?", opts:[
      {v:"yes",l:"Yes — clear"},{v:"partial",l:"Re-explained"},{v:"no",l:"Still unclear"}
    ]}
  ]},

{ id:"emp-ca-stop", sec:"Close", title:"California — education only",
  sub:"65 or older in California. Gold / Silver / Bronze is critical illness cover, so there is no second recommendation to make.",
  skip:()=> !(isEmployerTrack() && caRestricted()),
  blocks:[
    {t:"cablock"},
    {t:"do", text:"Gold / Silver / Bronze is cancer, heart attack and stroke cover, which <b>cannot be sold</b> here. They're staying on employer coverage, so there is no Medicare plan to present in its place either. This call ends as education."},
    {t:"say", text:"So {name}, that's really my recommendation for you today — hold onto that employer plan, delay Medicare, and hang onto that CMS L564 form for whenever you decide to retire. Do you have any questions on any of that?"},
    {t:"do", text:"Answer their questions and confirm they know how to reach you when their coverage situation changes."},
    {t:"say", text:"And when that time does come and you lose that creditable coverage, you give us a call and we'll walk you through the whole transition — that's what we're here for."},
    {t:"field", k:"followUp", label:"When to follow up", type:"textarea",
      ph:"Expected retirement date, when their coverage changes, when to check back in.", w:"lg"},
    {t:"choice", k:"outcome", label:"Call outcome", opts:[
      {v:"education", l:"Education only — CA restriction"},
      {v:"followup",  l:"Follow-up scheduled"}
    ]}
  ]},

{ id:"emp-gaps", sec:"Education", title:"Recommendation #2 — cover the gaps",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"Now my second recommendation would be to protect you from the gaps that employer plans typically leave behind."},
    {t:"info", text:"<b>Step 1</b> — reiterate their exposure (max out of pocket) &nbsp;·&nbsp; <b>Step 2</b> — explain the risk &nbsp;·&nbsp; <b>Step 3</b> — present Gold / Silver / Bronze."},
    {t:"say", text:"So right now, your employer plan has a max out of pocket of {moop}."},
    {t:"say", text:"What this means is, god forbid you have a bad health year, it's very likely you will pay {moop} for your healthcare <b>plus</b> potentially have loss of income — which are two significant exposures."},
    {t:"do", if:()=>!A("maxOOP"), text:"You never captured their max out of pocket. Go back and get it — this step doesn't land without a real number."}
  ]},

{ id:"emp-write", sec:"Education", title:"Have them write it down",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"That's where our <b>Gold, Silver and Bronze</b> options come in — they're designed to cover those big out-of-pocket risks while you stay on your employer plan."},
    {t:"say", text:"Now {name}, I want you to write down Gold, Silver and Bronze, and let me know once you've got that down."},
    {t:"do", text:"<b>Wait for confirmation before every single tier below.</b> One at a time. This is the pace of the whole close."}
  ]},

{ id:"emp-tiers", sec:"Education", title:"Gold, Silver, Bronze",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"Awesome, so next to Gold I want you to put <b>$30,000 for Cancer</b> and <b>$30,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$60,000</b>. That will be <b>$150 per month</b>. Let me know once you got that."},
    {t:"do", text:"Wait for confirmation."},
    {t:"say", text:"Perfect, now next to Silver I want you to put <b>$20,000 for Cancer</b> and <b>$20,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$40,000</b>. That will be <b>$100 per month</b>. Let me know once you got that."},
    {t:"do", text:"Wait for confirmation."},
    {t:"say", text:"Finally, next to Bronze I want you to put <b>$10,000 for Cancer</b> and <b>$10,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$20,000</b>. That will be <b>$50 per month</b>. Let me know once you got that."},
    {t:"do", text:"Wait for confirmation."},
    {t:"chsTiers"}
  ]},

{ id:"emp-choose", sec:"Close", title:"Get the commitment",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"Awesome, so based on these prices, which option do you feel like you can comfortably afford on top of your employer coverage?"},
    {t:"do", text:"<b>Ask, then stop talking.</b> The first one to talk loses."},
    {t:"choice", k:"chsChoice", label:"What did they choose?", opts:[
      {v:"gold",   l:"Gold — $150/mo",  sub:"$60,000 total benefit"},
      {v:"silver", l:"Silver — $100/mo",sub:"$40,000 total benefit"},
      {v:"bronze", l:"Bronze — $50/mo", sub:"$20,000 total benefit"},
      {v:"none",   l:"Objection / not yet"}
    ]},
    {t:"warn", if:()=>A("chsChoice")==="none",
      text:"Handle the objection, then <b>always end with a pre-emptive close.</b> Don't leave the ask hanging in the air."}
  ]},

{ id:"emp-close", sec:"Close", title:"Address & application",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"Sounds good, so what would be a good address to send policy packets and information?"},
    {t:"field", k:"address", label:"Street address", type:"textarea", ph:"Street, city, state, zip", w:"lg"},
    {t:"fields", items:[
      {k:"phone", label:"Best phone", ph:"", w:"md"},
      {k:"email", label:"Email",      ph:"", w:"md"}
    ]},
    {t:"choice", k:"outcome", label:"Call outcome", opts:[
      {v:"app",      l:"Application submitted"},
      {v:"followup", l:"Follow-up scheduled"},
      {v:"no",       l:"No sale"}
    ]},
    {t:"field", k:"followUp", label:"Follow-up / next action", type:"textarea", ph:"Date, time, what you owe them.", w:"lg"},
    {t:"do", text:"Handle any remaining objections and <b>always end with a pre-emptive close.</b>"}
  ]},

/* ================= 4. EDUCATION (ALREADY ON MEDICARE) — its own needs assessment ================= */
{ id:"m4-zip", sec:"CNA", title:"Zip code",
  sub:"Already on Medicare — this track has its own short needs assessment.",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"So for starters, what's your zip code?"},
    {t:"do", text:"Wait for the response, then <b>repeat the zip code back to them.</b>"},
    {t:"fields", items:[
      {k:"zip", label:"Zip code", ph:"e.g. 64111", w:"sm"},
      {k:"stateManual", label:"State", ph:()=>stateFromZip(A("zip"))||"auto", w:"sm",
       hint:"Auto-detected from the zip. Only California changes what you can pitch."}
    ]},
    {t:"cablock"},
    {t:"say", text:"Awesome, got that down."}
  ]},

{ id:"m4-dob", sec:"CNA", title:"Date of birth",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"Now what is your date of birth?"},
    {t:"field", k:"dob", label:"Date of birth", type:"mdy", w:"md"},
    {t:"do", text:()=>age()===null
      ? "Type the digits — <b>03141961</b> — and the slashes fill themselves in."
      : "Age <b>"+age()+"</b>."},
    {t:"cablock"},
    {t:"say", text:"Perfect, got that here."}
  ]},

{ id:"m4-coverage", sec:"CNA", title:"Current carrier & plan",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"Tell me a little bit about your current health insurance — what carrier is that with?"},
    {t:"say", text:"And is that an HMO… PPO?"},
    {t:"fields", items:[
      {k:"carrier",  label:"Carrier",  ph:"e.g. Aetna, Humana, UHC", w:"md"},
      {k:"planType", label:"HMO / PPO / other", ph:"HMO, PPO…",     w:"md"}
    ]}
  ]},

{ id:"m4-premium", sec:"CNA", title:"Monthly premium",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"What are you paying for that right now on a month to month basis?"},
    {t:"field", k:"currentPremium", label:"Current monthly premium", ph:"$", w:"sm"}
  ]},

{ id:"m4-moop", sec:"CNA", title:"Max out of pocket",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"And then you may not know this next part off the top of your head, but if you have your insurance card it should read off of there. What is your maximum out of pocket?"},
    {t:"field", k:"maxOOP", label:"Max out of pocket", ph:"$", w:"sm"},
    {t:"say", text:"Have you hit that max out of pocket, and if so what happened?"},
    {t:"field", k:"hitDeductible", label:"What happened", type:"textarea", ph:"Their story.", w:"lg"}
  ]},

{ id:"m4-dental", sec:"CNA", title:"Dental",
  sub:"Umbrella driver — the second question is the one that prices.",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"And are you carrying any dental insurance right now?"},
    {t:"field", k:"dentalNow", label:"Dental they carry today", ph:"Carrier, standalone, bundled with their plan, none…", w:"lg"},
    {t:"say", text:"<span class='q'>Is that coverage important to you?</span>"},
    {t:"choice", k:"dentalImport", label:"Is dental important to them?", opts:[
      {v:"yes", l:"Yes — it matters to them", sub:"+$50 Supplement umbrella"},
      {v:"no",  l:"No — not a priority",      sub:"No umbrella impact"}
    ]},
    {t:"cablock"},
    {t:"umbrella", if:()=>caRestricted()}
  ]},

{ id:"m4-exposures", sec:"CNA", title:"Major exposures — the set-up",
  skip:()=> !isOnMedicare() || caRestricted(),
  blocks:[
    {t:"say", text:"Gotcha. Now, in that webinar do you remember how we highlight major exposures?"},
    {t:"do", text:"Wait for the response."},
    {t:"say", text:"Major exposures can really stem from any plan — whether it's your current plan with {carrier}, or any other Medicare plan — but really in relation to two specific things."}
  ]},

{ id:"m4-chs", sec:"CNA", title:"Cancer, heart attack, stroke",
  sub:"Get their commitment on this one — not just an answer.",
  skip:()=> !isOnMedicare() || caRestricted(),
  blocks:[
    {t:"say", text:"For starters — cancer, heart attack, stroke. Do we have any personal or family history with the big three?"},
    {t:"field", k:"chsHistory", label:"Personal / family history with the big three", type:"textarea",
      ph:"Who, what, when — use their own words back to them later.", w:"lg"},
    {t:"say", text:"I really appreciate you sharing that with me… and the reason we bring this up — I'll share a personal note. My grandmother had cancer three times, and she was on Medicare and had great coverage, but even with that coverage she had to pay <b>$15,000</b> out of her own pocket for non-approved expenses."},
    {t:"say", text:"<span class='q'>Is something like that going to be a concern for you?</span>"},
    {t:"do", text:"<b>Get their commitment.</b> Not a shrug — a yes."},
    {t:"choice", k:"chsConcern", label:"Is CHS a concern for them?", opts:[
      {v:"yes", l:"Yes — committed", sub:"+$50 to both umbrellas"},
      {v:"no",  l:"No",              sub:"No umbrella impact"}
    ]}
  ]},

{ id:"m4-snf", sec:"CNA", title:"Skilled nursing",
  sub:"Get their commitment on this one too.",
  skip:()=> !isOnMedicare() || caRestricted(),
  blocks:[
    {t:"say", text:"Now the next big exposure we see is skilled nursing. Do you have any personal or family history with that, and are you familiar with how that coverage functions with Medicare?"},
    {t:"field", k:"snfHistory", label:"Skilled nursing history / familiarity", type:"textarea",
      ph:"Their experience and how much they already understand.", w:"lg"},
    {t:"say", text:"Medicare will help cover up to day 100 as long as you had a <b>3 day hospital stay</b> and are <b>showing signs of improvement</b>… but after day 100 you are responsible for all costs. And it's really important we focus on that 3 day hospital stay and showing signs of improvement."},
    {t:"say", text:"I had a client who was in skilled nursing for ten days and her insurance plan, Kaiser, said she was not improving and doing the exercises because she had a stroke — so they ended her care and she had to go home and pay <b>$20,000</b> out of pocket for home care. So I'm assuming this will be a concern as well?"},
    {t:"do", text:"<b>Get their commitment.</b>"},
    {t:"choice", k:"snfConcern", label:"Is skilled nursing a concern for them?", opts:[
      {v:"yes", l:"Yes — committed", sub:"+$50 Supplement · +$100 Advantage"},
      {v:"no",  l:"No",              sub:"No umbrella impact"}
    ]},
    {t:"say", text:"And yeah, we'll come back to that in greater detail, but I really just wanted to make sure you're aware of these exposures."},
    {t:"umbrella"}
  ]},

{ id:"m4-gate", sec:"Education", title:"Do they want the rundown?",
  sub:"Their answer decides whether you teach Supplement vs Advantage or go straight to the numbers.",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"Now I have pretty much everything I need, and before we dive into pricing I always prefer to do a quick rundown of the difference between Medicare Advantage and Supplement — would you like that?"},
    {t:"choice", k:"wantsEducation", label:"Do they want the rundown?", opts:[
      {v:"yes", l:"Yes — walk them through it", sub:"→ Supplement & Advantage education"},
      {v:"no",  l:"No — go to pricing",         sub:"→ Skip straight to the numbers"}
    ]},
    {t:"do", if:()=>A("wantsEducation")==="no",

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const $ = s => document.querySelector(s);
const skipped = st => typeof st.skip === "function" && st.skip();
const live = () => STEPS.filter(s=>!skipped(s));
const SECTIONS = ["Opening","CNA","Education","Plans","Pricing","Close"];

function clampStep(){
  if(S.step<0) S.step=0;
  if(S.step>=STEPS.length) S.step=STEPS.length-1;
  let i=S.step;
  while(i<STEPS.length && skipped(STEPS[i])) i++;
  if(i>=STEPS.length){ i=S.step; while(i>=0 && skipped(STEPS[i])) i--; }
  S.step = Math.max(0,i);
}
function go(dir){
  let i = S.step + dir;
  while(i>=0 && i<STEPS.length && skipped(STEPS[i])) i += dir;
  if(i<0 || i>=STEPS.length) return;
  S.step = i; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function jumpSection(sec){
  const i = STEPS.findIndex(s=>s.sec===sec && !skipped(s));
  if(i>=0){ S.step=i; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
}

let TPL = [];   // templates for live re-fill while typing

function txt(v){ return typeof v==="function" ? v() : v; }

function renderBlock(b){
  if(b.if && !b.if()) return "";
  const id = TPL.length;
  switch(b.t){
    case "say":   TPL.push(b.text); return '<div class="b say" data-tpl="'+id+'">'+fill(txt(b.text))+"</div>";
    case "do":    TPL.push(b.text); return '<div class="b do"><span class="ic">▸</span><span data-tpl="'+id+'">'+fill(txt(b.text))+"</span></div>";
    case "warn":  TPL.push(b.text); return '<div class="b warn"><span class="ic">⚠</span><span data-tpl="'+id+'">'+fill(txt(b.text))+"</span></div>";
    case "info":  TPL.push(b.text); return '<div class="b info" data-tpl="'+id+'">'+fill(txt(b.text))+"</div>";
    case "bullets": return '<div class="b bul">'+(b.title?"<h4>"+esc(b.title)+"</h4>":"")+
                    "<ul>"+b.items.map(i=>"<li>"+fill(i)+"</li>").join("")+"</ul></div>";
    case "field":  return '<div class="b frow">'+fieldHTML(b)+"</div>";
    case "fields": return '<div class="b frow">'+b.items.map(fieldHTML).join("")+"</div>";
    case "choice": return choiceHTML(b);
    case "goals":  return goalsHTML();
    case "umbrella":  return '<div class="b">'+umbrellaHTML(false)+"</div>";
    case "pricing":   return pricingHTML();
    case "chsTiers":  return chsTiersHTML();
    case "threesteps":return threeStepsHTML();
    case "readback":  return readbackHTML();
    case "avatarcard":return avatarCardHTML();
    case "cablock":   return caNoticeHTML();
    case "summary":   return summaryHTML();
    default: return "";
  }
}
const SELECTS = {
  avatarOverride:[
    {v:"",         l:"Auto — decided by their answers"},
    {v:"employer", l:"Employer coverage"},
    {v:"t65noss",  l:"T65 — not on Social Security"},
    {v:"t65ss",    l:"T65 — on Social Security"},
    {v:"medicare", l:"Currently on Medicare"}
  ]
};
function fieldHTML(f){
  const v = esc(A(f.k)), type = f.type||"text";
  f = {...f, ph: typeof f.ph==="function" ? f.ph() : f.ph};
  const w = f.w||"";
  let inner;
  if(type==="textarea"){
    inner = '<textarea data-k="'+f.k+'" placeholder="'+esc(f.ph||"")+'">'+v+"</textarea>";
  } else if(type==="select"){
    const opts = f.opts || SELECTS[f.k] || [];
    inner = '<select data-k="'+f.k+'">'+opts.map(o=>
      '<option value="'+esc(o.v)+'"'+(A(f.k)===o.v?" selected":"")+">"+esc(o.l)+"</option>").join("")+"</select>";
  } else if(type==="mdy"){
    const st = dateStatus(f.k);
    inner = '<input data-k="'+f.k+'" data-mdy type="text" inputmode="numeric" autocomplete="off" '+
      'class="'+(st.state==="ok"||st.state==="empty"?"":"bad")+'" '+   /* not focused yet */
      'value="'+esc(displayMDY(A(f.k)))+'" placeholder="mm/dd/yyyy">';
    return '<div class="f '+w+'"><label>'+esc(f.label)+"</label>"+inner+
           '<div class="hint'+(st.msg?" bad":"")+'" data-msgfor="'+f.k+'">'+
             esc(st.msg || f.hint || "")+"</div></div>";
  } else {
    inner = '<input data-k="'+f.k+'" type="'+type+'" value="'+v+'" placeholder="'+esc(f.ph||"")+'">';
  }
  return '<div class="f '+w+'"><label>'+esc(f.label)+"</label>"+inner+
         (f.hint?'<div class="hint">'+esc(f.hint)+"</div>":"")+"</div>";
}
function choiceHTML(c){
  const cur = A(c.k);
  return '<div class="b choice"><span class="clab">'+esc(c.label||"")+"</span><div class=\"opts\">"+
    c.opts.map(o=>{
      const on = cur===o.v ? " on":"";
      return '<label class="opt'+on+'" data-choice="'+c.k+'" data-v="'+esc(o.v)+'">'+
        '<span class="box"></span><span>'+esc(o.l)+
        (o.sub?'<span class="sub">'+esc(o.sub)+"</span>":"")+"</span></label>";
    }).join("")+"</div></div>";
}

    ((s.capped||m.capped)?'<div class="b warn" style="margin:12px 0 0"><span class="ic">⚠</span><span>Calculated above the $150 cap — capped at $150.</span></div>':"")+

/* ============================================================
   EVENTS
   ============================================================ */
/* Rewrite the field to mm/dd/yyyy and put the caret back where the agent
   left it — counted in digits, so the inserted slashes don't shift it. */
/* `how` distinguishes the three ways text arrives, because only two of them
   mean a separator: a paste, and the agent typing "/" themselves. A plain
   digit edit is read as digits alone — so surgery in the middle of a finished
   date produces an obviously broken value the agent can see, never a
   plausible wrong one that reads as real. */
function maskDate(el, how){
  const caret = el.selectionStart;
  const atEnd = caret === el.value.length;
  const digitsBefore = (el.value.slice(0,caret).match(/\d/g)||[]).length;
  const digits = (how.pasted || how.typedSep) ? normalizeTyped(el.value) : digitsOf(el.value);
  const out = formatMDY(digits, !how.deleting);
  if(out === el.value) return out;
  el.value = out;
  if(atEnd){ el.setSelectionRange(out.length,out.length); return out; }
  let pos = 0, seen = 0;
  while(pos<out.length && seen<digitsBefore){ if(/\d/.test(out[pos])) seen++; pos++; }
  if(out[pos]==="/" && seen===digitsBefore && digitsBefore>0 && digitsBefore<8) pos++;
  el.setSelectionRange(pos,pos);
  return out;
}
function paintDate(el){
  const st = dateStatus(el.dataset.k);
  const bad = st.state==="invalid" ||
              (st.state==="incomplete" && document.activeElement!==el);
  el.classList.toggle("bad", bad);
  const msg = document.querySelector('[data-msgfor="'+el.dataset.k+'"]');
  if(msg){ msg.textContent = st.msg; msg.classList.toggle("bad", !!st.msg); }
}

$("#blocks").addEventListener("input", e=>{
  const el = e.target;
  if(!el.dataset.k) return;
  if(el.dataset.mdy!==undefined){
    const before = A(el.dataset.k), it = e.inputType||"";
    maskDate(el, {
      deleting : it.startsWith("delete"),
      pasted   : it==="insertFromPaste" || it==="insertFromDrop" || it==="",
      typedSep : it==="insertText" && /^[\/\-. ]$/.test(e.data||"")
    });
    set(el.dataset.k, el.value);
    paintDate(el);
    /* A finished date can switch the California rule on or off, so redraw the
       whole step — then hand focus straight back to the agent. */
    if(dateStatus(el.dataset.k).state==="ok" && el.value!==before){
      const k = el.dataset.k;
      render();
      const again = document.querySelector('[data-k="'+k+'"]');
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      return;
    }
    refill(); renderRail(); return;
  }
  set(el.dataset.k, el.value); refill(); renderRail();
});
$("#blocks").addEventListener("change", e=>{
  const el = e.target;

    el.value = displayMDY(el.value);
  set(el.dataset.k, el.value); render();
});

  const filename = "mohr_call_"+name+"_"+new Date().toISOString().slice(0,10)+".txt";
  const text = summaryText();
  if(hosted()){
    if(!saver){ toast("Saving files isn't available here — use Copy summary."); return; }
    try{ await saver.save({filename, data:text}); toast("Summary saved"); }
    catch(err){ toast(err && err.code==="declined" ? "Save cancelled" : "Couldn't save — use Copy summary."); }
    return;
  }
  const blob = new Blob([text],{type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1900);
}

$("#btnBack").onclick = ()=>go(-1);
$("#btnNext").onclick = ()=>go(1);
$("#stepsRail").addEventListener("click", e=>{
  const b = e.target.closest("[data-sec]"); if(b) jumpSection(b.dataset.sec);
});
$("#scratch").addEventListener("input", e=>{ S.scratch = e.target.value; save(); });
$("#btnSummary").onclick = ()=>{ S.step = STEPS.length-1; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
$("#btnReset").onclick = ()=>{
  if(!confirm("Start a new call? Everything captured on this one will be cleared.")) return;
  S = structuredClone(BLANK); save(); render(); toast("New call started");
};
$("#btnTheme").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("mohr.theme", next); }catch(e){}
};
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft")  go(-1);
});

try{
  const th = localStorage.getItem("mohr.theme");
  if(th) document.documentElement.setAttribute("data-theme", th);
}catch(e){}
render();
</script>
</body>
