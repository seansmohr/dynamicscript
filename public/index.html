         const st = clientState();
         if(!st) return "Fills in from the zip code.";
         return (stateName(st)||st) + (A("stateEdited")==="1" ? " — entered by hand" : " — from the zip");
       }}
    ]},
    {t:"cablock"},
    {t:"say", text:"Awesome, got that down."}
  ]},

{ id:"cna-dob", sec:"CNA", title:"Date of birth",
  skip:()=> isOnMedicare(),
  blocks:[
    {t:"say", text:"Now what is your date of birth?"},
    {t:"field", k:"dob", label:"Date of birth", type:"mdy", w:"md"},
    {t:"do", text:()=>{
      if(age()===null) return "Type the digits — <b>03141961</b> — and the slashes fill themselves in. The age and the enrollment window appear here once the date is complete.";
      const a=age(), m=monthsTo65();
      let s = "Age <b>"+a+"</b>. Birth month is <b>"+birthMonthName()+"</b>. ";
      if(m>0)       s += "Turns 65 in about <b>"+m+" month"+(m===1?"":"s")+"</b> — manual enrollment window opens 3 months before the birth month.";
      else if(m===0)s += "<b>Turning 65 this month.</b>";
      else          s += "Already past 65 by about <b>"+Math.abs(m)+" months</b>.";
      return s;
    }},
    {t:"cablock"},
    {t:"say", text:"Perfect, got that here."}
  ]},

{ id:"cna-work", sec:"CNA", title:"Work status",
  sub:"Employer coverage with over 20 employees exits here, straight to Education (Employer).",
  skip:()=> isOnMedicare(),
  blocks:[
    {t:"say", text:"Tell me a little bit about your current situation — are you still working, are you retired, what does that look like?"},
    {t:"choice", k:"workStatus", label:"Work status", opts:[
      {v:"working",  l:"Still working"},
      {v:"partTime", l:"Part-time / semi-retired"},
      {v:"retired",  l:"Retired"},
      {v:"other",    l:"Other"}
    ]},
    {t:"field", k:"workNotes", label:"Details in their words", type:"textarea",
      ph:"What they said about work, timeline to retirement, spouse's situation…", w:"lg"},
    {t:"say", if:()=>hasEmployerJob(), text:"Does your employer have over 20 employees?"},
    {t:"choice", if:()=>hasEmployerJob(), k:"employerSize", label:"Employer size", opts:[
      {v:"over20",  l:"Over 20 employees", sub:"→ Education (Employer), skip the rest of the CNA"},
      {v:"under20", l:"20 or fewer",       sub:"→ Must transition to Medicare, continue the CNA"}
    ]},
    {t:"info", if:()=>isEmployerTrack(),
      text:"<b>Over 20 employees.</b> Skip the rest of this needs assessment — Education (Employer) has its own questions and picks up next."},
    {t:"warn", if:()=>A("employerSize")==="under20",
      text:"<b>20 or fewer employees — they must transition to Medicare.</b> Continue through the full needs assessment on the T65 track."}
  ]},

/* ================= 2b. CNA — T65 only ================= */
{ id:"cna-ss", sec:"CNA", title:"Social Security status",
  sub:"This is the split between the two T65 avatars.",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"Are you drawing Social Security yet?"},
    {t:"choice", k:"ssStatus", label:"Drawing Social Security?", opts:[
      {v:"yes", l:"Yes", sub:"→ Auto-enrolled into A & B"},
      {v:"no",  l:"No",  sub:"→ We enroll them manually"}
    ]}
  ]},

{ id:"cna-coverage", sec:"CNA", title:"Current insurance carrier & source",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"Tell me a little bit about your current health insurance — is that through your employer or through the marketplace?"},
    {t:"choice", k:"coverageSource", label:"Where the coverage comes from", opts:[
      {v:"employer",   l:"Employer group plan"},
      {v:"marketplace",l:"Marketplace / ACA"},
      {v:"retiree",    l:"Retiree / COBRA / union"},
      {v:"none",       l:"No coverage right now"}
    ]},
    {t:"say", text:"What carrier is that with?"},
    {t:"say", text:"And is that an HMO… PPO?"},
    {t:"fields", items:[
      {k:"carrier",  label:"Carrier",  ph:"e.g. Blue Cross, Kaiser, Aetna", w:"md"},
      {k:"planType", label:"HMO / PPO / other", ph:"HMO, PPO, EPO, HDHP…",  w:"md"}
    ]}
  ]},

{ id:"cna-premium", sec:"CNA", title:"Monthly premium",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"What are you paying for that right now on a month to month basis?"},
    {t:"field", k:"currentPremium", label:"Current monthly premium", ph:"$", w:"sm"}
  ]},

{ id:"cna-deduct", sec:"CNA", title:"Deductible & max out of pocket",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"And then you may not know this next part off the top of your head, but if you have your insurance card it should read off of there. What is your deductible and maximum out of pocket?"},
    {t:"fields", items:[
      {k:"deductible", label:"Deductible",        ph:"$", w:"sm"},
      {k:"maxOOP",     label:"Max out of pocket", ph:"$", w:"sm"}
    ]},
    {t:"say", text:"Have you hit that deductible or max out of pocket, and if so what happened?"},
    {t:"field", k:"hitDeductible", label:"What happened", type:"textarea",
      ph:"Their story — this is your best material for the exposure conversation later.", w:"lg"}
  ]},

{ id:"cna-health", sec:"CNA", title:"Health history & prescriptions",
  skip:()=> !isT65(),
  blocks:[
    {t:"choice", k:"healthTone", label:"Which read fits what you've heard so far?", opts:[
      {v:"healthy", l:"“Sounds like you're pretty healthy”"},
      {v:"history", l:"“Sounds like you have a little bit of a health history”"}
    ]},
    {t:"say", text:()=> "And that leads me into my next question — sounds like you're <b>"
      + (A("healthTone")==="history" ? "someone with a little bit of a health history"
        : A("healthTone")==="healthy" ? "pretty healthy"
        : "pretty healthy / have a little bit of a health history")
      + "</b>. Is there anything with your recent health we should know about in the past 5 years?"},
    {t:"field", k:"healthHistory", label:"Health history — past 5 years", type:"textarea",
      ph:"Conditions, surgeries, hospitalizations, anything that affects underwriting.", w:"lg"},
    {t:"do", text:"Underwriting matters here. Anything major in the last 5 years can affect a Supplement approval."},
    {t:"say", text:"Okay, and are you taking any prescriptions right now, and what are they actively treating?"},
    {t:"field", k:"prescriptions", label:"Prescriptions & what they treat", type:"textarea",
      ph:"Drug name — dosage — what it treats", w:"lg"}
  ]},

{ id:"cna-dental", sec:"CNA", title:"Dental importance",
  sub:"Umbrella driver — a yes here adds $50 to the Medicare Supplement umbrella.",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"My next question would be, is dental insurance important to you, and do you currently have that with your employer or through the marketplace?"},
    {t:"choice", k:"dentalImport", label:"Is dental important to them?", opts:[
      {v:"yes", l:"Yes — it matters to them", sub:"+$50 Supplement umbrella"},
      {v:"no",  l:"No — not a priority",      sub:"No umbrella impact"}
    ]},
    {t:"field", k:"dentalNow", label:"Do they have dental today, and where?", ph:"Employer, marketplace, standalone, none…", w:"lg"},
    {t:"info", if:()=>!caRestricted(), text:"Dental only prices into the <b>Supplement</b> umbrella. A Medicare Advantage plan already bundles dental, so it adds nothing on that side."},
    {t:"cablock"},
    {t:"umbrella", if:()=>caRestricted()}
  ]},

{ id:"cna-exposures", sec:"CNA", title:"Major exposures — the set-up",
  skip:()=> !isT65() || caRestricted(),
  blocks:[
    {t:"say", text:"Now, in that webinar do you remember how we highlight major exposures?"},
    {t:"do", text:"Wait for the response."},
    {t:"say", text:"Major exposures can really stem from any plan — whether it's your current plan with {carrier}, or a Medicare Supplement or Advantage plan — but really in relation to two specific things."},
    {t:"do", text:"Do not rush the next two steps. Everything you price later comes out of these two answers."}
  ]},

{ id:"cna-chs", sec:"CNA", title:"Cancer, heart attack, stroke",
  sub:"Umbrella driver — a yes here adds $50 to both umbrellas.",
  skip:()=> !isT65() || caRestricted(),
  blocks:[
    {t:"say", text:"For starters — cancer, heart attack, stroke. Do we have any personal or family history with the big three?"},
    {t:"field", k:"chsHistory", label:"Personal / family history with the big three", type:"textarea",
      ph:"Who, what, when — use their own words back to them later.", w:"lg"},
    {t:"say", text:"I really appreciate you sharing that with me… and the reason we bring this up — I'll share a personal note. My grandmother had cancer three times, and she was on Medicare and had great coverage, but even with that coverage she had to pay <b>$15,000</b> out of her own pocket for non-approved expenses."},
    {t:"say", text:"<span class='q'>Is something like that going to be a concern for you?</span>"},
    {t:"do", text:"Wait for the response. Let the silence sit."},
    {t:"choice", k:"chsConcern", label:"Is CHS a concern for them?", opts:[
      {v:"yes", l:"Yes — it's a concern", sub:"+$50 to both umbrellas"},
      {v:"no",  l:"No",                   sub:"No umbrella impact"}
    ]}
  ]},

{ id:"cna-snf", sec:"CNA", title:"Skilled nursing",
  sub:"Umbrella driver — a yes here adds $50 to the Supplement umbrella and $100 to the Advantage umbrella.",
  skip:()=> !isT65() || caRestricted(),
  blocks:[
    {t:"say", text:"Now the next big exposure we see is skilled nursing. Do you have any personal or family history with that, and are you familiar with how that coverage functions with Medicare?"},
    {t:"field", k:"snfHistory", label:"Skilled nursing history / familiarity", type:"textarea",
      ph:"Their experience and how much they already understand.", w:"lg"},
    {t:"say", text:"Medicare will help cover up to day 100 as long as you had a <b>3 day hospital stay</b> and are <b>showing signs of improvement</b>… but after day 100 you are responsible for all costs. And it's really important we focus on that 3 day hospital stay and showing signs of improvement."},
    {t:"say", text:"I had a client who was in skilled nursing for ten days and her insurance plan, Kaiser, said she was not improving and doing the exercises because she had a stroke — so they ended her care and she had to go home and pay <b>$20,000</b> out of pocket for home care. So I'm assuming this will be a concern as well?"},
    {t:"do", text:"Wait for the response."},
    {t:"choice", k:"snfConcern", label:"Is skilled nursing a concern for them?", opts:[
      {v:"yes", l:"Yes — it's a concern", sub:"+$50 Supplement · +$100 Advantage"},
      {v:"no",  l:"No",                   sub:"No umbrella impact"}
    ]},
    {t:"say", text:"And yeah, we'll come back to that in greater detail, but I really just wanted to make sure you're aware of these exposures."},
    {t:"umbrella"}
  ]},

{ id:"cna-partb", sec:"CNA", title:"Part B premium — income qualification",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"Now, when you transition to Medicare you'll be responsible for a Part B premium — however that premium is going to be very dependent on your household income. Do you know where that's at at this moment in time?"},
    {t:"field", k:"income", label:"Household income", ph:"$", w:"md"},
    {t:"say", text:"And has that been pretty consistent over the last two years?"},
    {t:"choice", k:"incomeConsistent", label:"Consistent over 2 years?", opts:[
      {v:"yes",l:"Yes"},{v:"no",l:"No — it's changed"},{v:"unsure",l:"Not sure"}
    ]},
    {t:"say", text:"And the reason I ask is they always look back two years prior."},
    {t:"field", k:"incomeNotes", label:"Notes", ph:"Life-changing event? IRMAA appeal worth flagging?", w:"lg"}
  ]},

{ id:"cna-retirement", sec:"CNA", title:"Retirement assets",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"And another thing that can impact your Part B premium, which not a lot of people think about — do you have any retirement accounts that have over $200,000 in qualified assets or more?"},
    {t:"choice", k:"assets200k", label:"Over $200,000 in qualified assets?", opts:[
      {v:"yes",l:"Yes"},{v:"no",l:"No"},{v:"declined",l:"Wouldn't say"}
    ]},
    {t:"say", text:"And the reason I ask is because when we plan to supplement our income with the money within those accounts, that can impact your Part B premium. Have you had the chance to talk to a retirement specialist yet?"},
    {t:"choice", k:"retirementSpecialist", label:"Talked to a retirement specialist?", opts:YN},
    {t:"say", if:()=>A("retirementSpecialist")==="no",
      text:"Okay, well we have a full partnership on hand, so if you ever want to sit down and have that conversation it is a service we offer <b>free of charge</b>, and we can look at getting you scheduled for that once we're done here — okay?"},
    {t:"choice", k:"retirementReferral", label:"Do they want the retirement appointment?", opts:[
      {v:"yes",l:"Yes — book it after the call"},{v:"maybe",l:"Maybe / later"},{v:"no",l:"No"}
    ]}
  ]},

{ id:"cna-close", sec:"CNA", title:"Close out the CNA",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", text:"Awesome, that wraps up the needs assessment. Now we're going to walk through your options and answer the questions you had at the beginning."},
    {t:"avatarcard"}
  ]},

/* ================= 3. EDUCATION (EMPLOYER) — its own needs assessment ================= */
{ id:"emp-ss", sec:"CNA", title:"Employer track — Social Security status",
  sub:"Drawing Social Security changes both the delay recommendation and the L564 instructions.",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"Are you drawing Social Security yet?"},
    {t:"choice", k:"ssStatus", label:"Drawing Social Security?", opts:[
      {v:"yes", l:"Yes", sub:"Delay Part B only — Part A is automatic"},
      {v:"no",  l:"No",  sub:"Delay Part A and Part B entirely"}
    ]},
    {t:"warn", if:()=>A("ssStatus")==="yes",
      text:"<b>Take note.</b> They're drawing Social Security, so they will be automatically enrolled in Part A and will need to <b>request to delay Part B</b>."}
  ]},

{ id:"emp-coverage", sec:"CNA", title:"Employer track — carrier & plan",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"Tell me a little bit about your current health insurance — is that through your employer?"},
    {t:"choice", k:"empCoverageIsEmployer", label:"Coverage is through the employer?", opts:YN},
    {t:"warn", if:()=>A("empCoverageIsEmployer")==="no",
      text:"The delay recommendation rests on them having <b>creditable employer coverage</b>. If the plan isn't through the employer, find out what it actually is before you recommend delaying anything."},
    {t:"say", text:"What carrier is that with?"},
    {t:"say", text:"And is that an HMO… PPO?"},
    {t:"fields", items:[
      {k:"carrier",  label:"Carrier",  ph:"e.g. Blue Cross, Kaiser, Aetna", w:"md"},
      {k:"planType", label:"HMO / PPO / other", ph:"HMO, PPO, EPO, HDHP…",  w:"md"}
    ]}
  ]},

{ id:"emp-premium", sec:"CNA", title:"Employer track — monthly premium",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"What are you paying for that right now on a month to month basis?"},
    {t:"field", k:"currentPremium", label:"Current monthly premium", ph:"$", w:"sm"}
  ]},

{ id:"emp-moop", sec:"CNA", title:"Employer track — max out of pocket",
  sub:"This number is the entire basis of the Gold / Silver / Bronze pitch. Do not leave it blank.",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"And then you may not know this next part off the top of your head, but if you have your insurance card it should read off of there. What is your maximum out of pocket?"},
    {t:"field", k:"maxOOP", label:"Max out of pocket", ph:"$", w:"sm"},
    {t:"say", text:"Have you hit that max out of pocket, and if so what happened?"},
    {t:"field", k:"hitDeductible", label:"What happened", type:"textarea",
      ph:"Their story — you have no other exposure conversation on this track, so this is your material.", w:"lg"},
    {t:"do", text:"Get their commitment before you move on."},
    {t:"say", text:"Yeah, that makes sense. So I have all the information I need and have two recommendations for you."}
  ]},

{ id:"emp-delay", sec:"Education", title:"Recommendation #1 — delay Medicare",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", if:()=>A("ssStatus")!=="yes",
      text:"So right now this transition to Medicare does not make much sense for you, so my first recommendation would be to <b>delay Part A and Part B entirely.</b> You have a strong plan with your employer and your premiums are pretty low."},
    {t:"say", if:()=>A("ssStatus")==="yes",
      text:"So right now this transition to Medicare does not make much sense for you, so my first recommendation would be to <b>delay Part B entirely</b> — but you will be automatically enrolled in Part A, because you're drawing Social Security. You have a strong plan with your employer and your premiums are pretty low."},
    {t:"do", if:()=>!A("ssStatus"), text:"Answer the Social Security question a step back — it decides whether this is \"delay Part A and Part B\" or \"delay Part B only.\""},
    {t:"do", text:()=> "Their plan: <b>"+(A("carrier")||"[carrier]")+"</b> at <b>"+(A("currentPremium")?money(num(A("currentPremium"))):"[premium]")+"/mo</b>, max out of pocket <b>"+(A("maxOOP")?money(num(A("maxOOP"))):"[max OOP]")+"</b>."}
  ]},

{ id:"emp-penalty", sec:"Education", title:"Peace of mind on penalties",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:"And I want to make sure you are at peace of mind with penalties, since that's always a big concern. <b>You won't be penalized for delaying Medicare</b> since you have creditable coverage with your employer. Are we clear on that?"},
    {t:"do", text:"Wait for the response. Do not move on without a yes."}
  ]},

{ id:"emp-l564", sec:"Education", title:"CMS L564 — the hall pass",
  skip:()=> !isEmployerTrack(),
  blocks:[
    {t:"say", text:()=>{
      const parts = A("ssStatus")==="yes" ? "<b>Part B</b>" : "<b>Part A and Part B</b>";
      return "Now when you do decide to retire, or you lose that creditable coverage, that's when you take action. That's when you take <b>CMS L564</b> — it's a form you'll take to your HR department and they'll help you fill it out. Then you'll take that form and you're gonna submit it along with your application for "+parts+". That form is basically your <b>hall pass that voids all penalties.</b> Are we clear on that?";
    }},
    {t:"do", text:"Wait for the response."},
    {t:"choice", k:"empUnderstands", label:"Confirmed they're clear on both?", opts:[
      {v:"yes",l:"Yes — clear"},{v:"partial",l:"Re-explained"},{v:"no",l:"Still unclear"}
    ]}
  ]},

{ id:"emp-ca-stop", sec:"Close", title:"California — education only",
  sub:"65 or older in California. Gold / Silver / Bronze is critical illness cover, so there is no second recommendation to make.",
  skip:()=> !(isEmployerTrack() && caRestricted()),
  blocks:[
    {t:"cablock"},
    {t:"do", text:"Gold / Silver / Bronze is cancer, heart attack and stroke cover, which <b>cannot be sold</b> here. They're staying on employer coverage, so there is no Medicare plan to present in its place either. This call ends as education."},
    {t:"say", text:"So {name}, that's really my recommendation for you today — hold onto that employer plan, delay Medicare, and hang onto that CMS L564 form for whenever you decide to retire. Do you have any questions on any of that?"},
    {t:"do", text:"Answer their questions and confirm they know how to reach you when their coverage situation changes."},
    {t:"say", text:"And when that time does come and you lose that creditable coverage, you give us a call and we'll walk you through the whole transition — that's what we're here for."},
    {t:"field", k:"followUp", label:"When to follow up", type:"textarea",
      ph:"Expected retirement date, when their coverage changes, when to check back in.", w:"lg"},
    {t:"choice", k:"outcome", label:"Call outcome", opts:[
      {v:"education", l:"Education only — CA restriction"},
      {v:"followup",  l:"Follow-up scheduled"}
    ]}
  ]},

{ id:"emp-gaps", sec:"Education", title:"Recommendation #2 — cover the gaps",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"Now my second recommendation would be to protect you from the gaps that employer plans typically leave behind."},
    {t:"info", text:"<b>Step 1</b> — reiterate their exposure (max out of pocket) &nbsp;·&nbsp; <b>Step 2</b> — explain the risk &nbsp;·&nbsp; <b>Step 3</b> — present Gold / Silver / Bronze."},
    {t:"say", text:"So right now, your employer plan has a max out of pocket of {moop}."},
    {t:"say", text:"What this means is, god forbid you have a bad health year, it's very likely you will pay {moop} for your healthcare <b>plus</b> potentially have loss of income — which are two significant exposures."},
    {t:"do", if:()=>!A("maxOOP"), text:"You never captured their max out of pocket. Go back and get it — this step doesn't land without a real number."}
  ]},

{ id:"emp-write", sec:"Education", title:"Have them write it down",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"That's where our <b>Gold, Silver and Bronze</b> options come in — they're designed to cover those big out-of-pocket risks while you stay on your employer plan."},
    {t:"say", text:"Now {name}, I want you to write down Gold, Silver and Bronze, and let me know once you've got that down."},
    {t:"do", text:"<b>Wait for confirmation before every single tier below.</b> One at a time. This is the pace of the whole close."}
  ]},

{ id:"emp-tiers", sec:"Education", title:"Gold, Silver, Bronze",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"Awesome, so next to Gold I want you to put <b>$30,000 for Cancer</b> and <b>$30,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$60,000</b>. That will be <b>$150 per month</b>. Let me know once you got that."},
    {t:"do", text:"Wait for confirmation."},
    {t:"say", text:"Perfect, now next to Silver I want you to put <b>$20,000 for Cancer</b> and <b>$20,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$40,000</b>. That will be <b>$100 per month</b>. Let me know once you got that."},
    {t:"do", text:"Wait for confirmation."},
    {t:"say", text:"Finally, next to Bronze I want you to put <b>$10,000 for Cancer</b> and <b>$10,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$20,000</b>. That will be <b>$50 per month</b>. Let me know once you got that."},
    {t:"do", text:"Wait for confirmation."},
    {t:"chsTiers"}
  ]},

{ id:"emp-choose", sec:"Close", title:"Get the commitment",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"Awesome, so based on these prices, which option do you feel like you can comfortably afford on top of your employer coverage?"},
    {t:"do", text:"<b>Ask, then stop talking.</b> The first one to talk loses."},
    {t:"choice", k:"chsChoice", label:"What did they choose?", opts:[
      {v:"gold",   l:"Gold — $150/mo",  sub:"$60,000 total benefit"},
      {v:"silver", l:"Silver — $100/mo",sub:"$40,000 total benefit"},
      {v:"bronze", l:"Bronze — $50/mo", sub:"$20,000 total benefit"},
      {v:"none",   l:"Objection / not yet"}
    ]},
    {t:"warn", if:()=>A("chsChoice")==="none",
      text:"Handle the objection, then <b>always end with a pre-emptive close.</b> Don't leave the ask hanging in the air."}
  ]},

{ id:"emp-close", sec:"Close", title:"Address & application",
  skip:()=> !isEmployerTrack() || caRestricted(),
  blocks:[
    {t:"say", text:"Sounds good, so what would be a good address to send policy packets and information?"},
    {t:"field", k:"address", label:"Street address", type:"textarea", ph:"Street, city, state, zip", w:"lg"},
    {t:"fields", items:[
      {k:"phone", label:"Best phone", ph:"", w:"md"},
      {k:"email", label:"Email",      ph:"", w:"md"}
    ]},
    {t:"choice", k:"outcome", label:"Call outcome", opts:[
      {v:"app",      l:"Application submitted"},
      {v:"followup", l:"Follow-up scheduled"},
      {v:"no",       l:"No sale"}
    ]},
    {t:"field", k:"followUp", label:"Follow-up / next action", type:"textarea", ph:"Date, time, what you owe them.", w:"lg"},
    {t:"do", text:"Handle any remaining objections and <b>always end with a pre-emptive close.</b>"}
  ]},

/* ================= 4. EDUCATION (ALREADY ON MEDICARE) — its own needs assessment ================= */
{ id:"m4-zip", sec:"CNA", title:"Zip code",
  sub:"Already on Medicare — this track has its own short needs assessment.",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"So for starters, what's your zip code?"},
    {t:"do", text:"Wait for the response, then <b>repeat the zip code back to them.</b>"},
    {t:"fields", items:[
      {k:"zip", label:"Zip code", ph:"e.g. 64111", w:"sm"},
      {k:"stateManual", label:"State", ph:"auto", w:"sm", hint:()=>{
         const st = clientState();
         if(!st) return "Fills in from the zip code.";
         return (stateName(st)||st) + (A("stateEdited")==="1" ? " — entered by hand" : " — from the zip");
       }}
    ]},
    {t:"cablock"},
    {t:"say", text:"Awesome, got that down."}
  ]},

{ id:"m4-dob", sec:"CNA", title:"Date of birth",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"Now what is your date of birth?"},
    {t:"field", k:"dob", label:"Date of birth", type:"mdy", w:"md"},
    {t:"do", text:()=>age()===null
      ? "Type the digits — <b>03141961</b> — and the slashes fill themselves in."
      : "Age <b>"+age()+"</b>."},
    {t:"cablock"},
    {t:"say", text:"Perfect, got that here."}
  ]},

/* ========== 4.0 SHARED OPENING — before the branch ========== */
{ id:"m4-carrier", sec:"CNA", title:"Current carrier — and which product",
  sub:"The branch point. Everything after this depends on whether they hold Advantage or a Supplement.",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"say", text:"Tell me a little bit about your current health insurance — what carrier is that with?"},
    {t:"field", k:"carrier", label:"Carrier", ph:"e.g. Aetna, Humana, UHC", w:"md"},
    {t:"say", text:"<span class='q'>And is that a Medicare Advantage or Medicare Supplement plan?</span>"},
    {t:"choice", k:"currentPlanKind", label:"What are they on?", opts:[
      {v:"ma",   l:"Medicare Advantage", sub:"→ Branch 4A"},
      {v:"supp", l:"Medicare Supplement", sub:"→ Branch 4B"}
    ]},
    {t:"info", if:()=>!A("currentPlanKind"),
      text:"<b>If they don't know</b>, ask: <i>“Does your card say the carrier's name at the top with copays listed on it, or does it say Medicare Supplement Plan G or Plan N?”</i><br>Copays for doctor visits → <b>Advantage</b>. A plan letter on the card → <b>Supplement</b>."},
    {t:"cablock"},
    {t:"do", if:()=>caRestricted(),
      text:"California check done off the zip and date of birth. No ancillary on this call — you'll land on the California close inside whichever branch they take."}
  ]},

/* ========== BRANCH 4A — MEDICARE ADVANTAGE ========== */
{ id:"m4a-plan", sec:"CNA", title:"Advantage — plan type & premium",
  skip:()=> !isOnMedicare() || !onMA(),
  blocks:[
    {t:"say", text:"And is that an HMO or a PPO?"},
    {t:"say", text:"What are you paying for that right now on a month to month basis?"},
    {t:"fields", items:[
      {k:"planType", label:"HMO / PPO", ph:"HMO, PPO…", w:"md"},
      {k:"currentPremium", label:"Monthly premium", ph:"$", w:"sm"}
    ]}
  ]},

{ id:"m4a-exposures", sec:"CNA", title:"Advantage — cancer, heart attack, stroke",
  sub:"Skipped when the California restriction applies — there is no critical illness product to sell.",
  skip:()=> !isOnMedicare() || !onMA() || caRestricted(),
  blocks:[
    {t:"say", text:"Gotcha. Now, in that webinar do you remember how we highlight major exposures?"},
    {t:"do", text:"Wait for the response."},
    {t:"say", text:"Major exposures can really stem from any plan — whether it's your current plan with {carrier}, or any other Medicare plan — but really in relation to <b>three specific things</b>."},
    {t:"say", text:"Which are cancer, heart attack, stroke. Do we have any personal or family history with the big three?"},
    {t:"field", k:"chsHistory", label:"Personal / family history with the big three", type:"textarea",
      ph:"Who, what, when — use their own words back to them later.", w:"lg"},
    {t:"say", text:"I really appreciate you sharing that with me… and the reason we bring this up — I'll share a personal note. My grandmother had cancer three times, and she was on Medicare and had great coverage, but even with that coverage she had to pay <b>$10,000</b> out of her own pocket for non-approved expenses. <span class='q'>Is something like that going to be a concern for you?</span>"},
    {t:"do", text:"<b>Get their commitment.</b>"},
    {t:"choice", k:"chsConcern", label:"Is CHS a concern for them?", opts:[
      {v:"yes", l:"Yes — committed"},{v:"no", l:"No"}
    ]},
    {t:"say", text:"And yeah, we'll come back to that in greater detail, but I really just wanted to make sure you're aware of that exposure."}
  ]},

{ id:"m4a-sep", sec:"CNA", title:"Advantage — timing check",
  sub:"Decides which close you land on. Never promise a special enrollment period before it is verified.",
  skip:()=> !isOnMedicare() || !onMA(),
  blocks:[
    {t:"say", text:"Now before I make any recommendations, quick timing question. Has anything changed recently? Did you move, lose other coverage, or start getting any help paying for prescriptions?"},
    {t:"choice", k:"sepChanges", label:"Anything changed?", opts:[
      {v:"yes",l:"Yes — something changed"},{v:"no",l:"No"}
    ]},
    {t:"field", k:"sepDetail", label:"What changed", type:"textarea", ph:"Move, lost coverage, Extra Help / LIS…", w:"lg"},
    {t:"say", text:"And has {carrier} mailed you anything about your plan changing?"},
    {t:"choice", k:"sepMail", label:"Mail about the plan changing?", opts:[
      {v:"yes",l:"Yes"},{v:"no",l:"No"}
    ]},
    {t:"say", if:()=>sepAnyYes(), text:"That may open a window for you. Let me verify it before I promise anything."},
    {t:"warn", if:()=>sepAnyYes(),
      text:"<b>Verify before you promise.</b> Never tell them they have a special enrollment period until you have confirmed it."},
    {t:"aep"}
  ]},

{ id:"m4a-timing", sec:"Education", title:"Advantage — set the frame",
  skip:()=> !isOnMedicare() || !onMA(),
  blocks:[
    {t:"say", if:()=>aepRoute()==="outside",
      text:"So here's where we're at. You're locked into {carrier} until October 15th. I can't change your medical plan today, and I'm not going to pretend otherwise."},
    {t:"say", if:()=>aepRoute()==="outside",
      text:"What I can do is show you where this plan leaves you exposed, and show you how we can get rid of that exposure. Sound fair?"},
    {t:"say", if:()=>aepRoute()==="in",
      text:"Good timing. We're in the window where I can actually change your plan. We'll do it in the right order — exposure first, then the plan itself. Sound fair?"},
    {t:"do", text:"Wait for the response."},
    {t:"aep"}
  ]},

{ id:"m4a-planname", sec:"Education", title:"Advantage — get the exact plan name",
  skip:()=> !isOnMedicare() || !onMA(),
  blocks:[
    {t:"say", text:"Grab your insurance card for me. I want the exact plan name off the front — {carrier} has a few plans in your area and I want to be sure I'm looking at yours."},
    {t:"field", k:"planNameExact", label:"Exact plan name from the card", ph:"As printed on the front of the card", w:"lg"},
    {t:"warn", text:"<b>Pull up the Summary of Benefits</b> for that exact plan and zip — you need their <b>critical illness coinsurance percentage</b>, and the next line does not land without a real number."},
    {t:"do", text:"Get their commitment before you move on."}
  ]},

{ id:"m4a-exposure", sec:"Education", title:"Advantage — where the plan leaves them exposed",
  sub:"The coinsurance percentage is the only number in this section. Read it off the Summary of Benefits.",
  skip:()=> !isOnMedicare() || !onMA() || caRestricted(),
  blocks:[
    {t:"info", text:"<b>Step 1</b> — explain the risk &nbsp;·&nbsp; <b>Step 2</b> — address the concern &nbsp;·&nbsp; <b>Step 3</b> — present Gold / Silver / Bronze."},
    {t:"field", k:"criticalPct", label:"Their critical illness coinsurance", ph:"e.g. 20", w:"sm",
      hint:"Straight off the Summary of Benefits — the % of treatment costs they carry."},
    {t:"do", if:()=>!A("criticalPct"),
      text:"You don't have the percentage yet. Get it off the Summary of Benefits before you read the next line — this is the whole exposure."},
    {t:"say", text:"So I found your current plan with {carrier} and I am looking through the summary of benefits, which is just the list of items that your plan covers. I can see here that your biggest exposure is to <b>critical illnesses</b>. Your plan has you paying <b>{critPct}</b> of all treatment costs, god forbid you get diagnosed with a critical illness. <span class='q'>Were you aware of that?</span>"},
    {t:"do", text:"Wait for the response."},
    {t:"say", text:"<span class='q'>And is that going to be a concern for you?</span>"},
    {t:"do", text:"<b>Get their commitment.</b>"},
    {t:"choice", k:"critConcern", label:"Is the coinsurance exposure a concern for them?", opts:[
      {v:"yes", l:"Yes — committed"},{v:"no", l:"No"}
    ]},
    {t:"say", text:"That's where our <b>Gold, Silver and Bronze</b> options come in. They're designed to cover those big out of pocket risks while you stay on your plan with {carrier} — and if you decide to transition to a new plan later on."}
  ]},

{ id:"m4a-tiers", sec:"Education", title:"Advantage — Gold, Silver, Bronze",
  skip:()=> !isOnMedicare() || !onMA() || caRestricted(),
  blocks:[
    {t:"say", text:"Now {name}, I want you to write down Gold, Silver and Bronze, and let me know once you've got that down."},
    {t:"do", text:"<b>Wait for confirmation before every tier.</b> One at a time."},
    {t:"say", text:"Awesome, so next to Gold I want you to put <b>$30,000 for Cancer</b> and <b>$30,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$60,000</b>. That will be <b>$150 per month</b>. Let me know once you got that."},
    {t:"say", text:"Perfect, now next to Silver I want you to put <b>$20,000 for Cancer</b> and <b>$20,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$40,000</b>. That will be <b>$100 per month</b>. Let me know once you got that."},
    {t:"say", text:"Finally, next to Bronze I want you to put <b>$10,000 for Cancer</b> and <b>$10,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$20,000</b>. That will be <b>$50 per month</b>. Let me know once you got that."},
    {t:"say", text:"Awesome, so based on these prices, which option do you feel like you can comfortably afford on top of your current coverage?"},
    {t:"do", text:"<b>Ask, then stop talking.</b>"},
    {t:"choice", k:"chsChoice", label:"What did they choose?", opts:[
      {v:"gold",   l:"Gold — $150/mo",  sub:"$60,000 total benefit"},
      {v:"silver", l:"Silver — $100/mo",sub:"$40,000 total benefit"},
      {v:"bronze", l:"Bronze — $50/mo", sub:"$20,000 total benefit"},
      {v:"none",   l:"Objection / not yet"}
    ]},
    {t:"chsTiers"}
  ]},

{ id:"m4a-close", sec:"Close", title:"Advantage — the close",
  sub:()=> aepRoute()==="outside" ? "Outside AEP — two steps." : "In AEP or verified SEP — three steps.",
  skip:()=> !isOnMedicare() || !onMA() || caRestricted(),
  blocks:[
    {t:"aep"},
    {t:"readback"},
    {t:"say", if:()=>aepRoute()==="outside",
      text:"Based on everything you told me today — <i>(read back your notes)</i> — my recommendation is the <b>{tierName}</b> umbrella at <b>{tierPrice}</b> a month, and a full review of your {carrier} plan in October."},
    {t:"say", if:()=>aepRoute()==="in",
      text:"Based on everything you told me today — <i>(read back your notes)</i> — my recommendation is the <b>{tierName}</b> umbrella at <b>{tierPrice}</b> a month, plus a full review of your {carrier} plan in the next 48 hours."},
    {t:"do", text:"<b>PAUSE. The first one to talk loses.</b>"},
    {t:"say", if:()=>aepRoute()==="outside", text:"Still have that paper? Write this down. <b>Two steps.</b>"},
    {t:"say", if:()=>aepRoute()==="in", text:"Still have that paper? Write this down. <b>Three steps.</b>"},
    {t:"threesteps"},
    {t:"say", text:"<b>Step 1 is the only thing we knock out today.</b>"},
    {t:"say", if:()=>aepRoute()==="outside",
      text:"The reason we handle this now instead of waiting until October is because we need to make sure we can get you approved through underwriting. That way if for some reason one company doesn't approve you, we still have time to pivot and find another option. The other important part is once you're approved, this locks in your rate based on your age right now — so it's never going to jump because of your health later on."},
    {t:"say", if:()=>aepRoute()==="in",
      text:"That's because we need to make sure we can get you approved through underwriting. That way if for some reason one company doesn't approve you, we still have time to pivot and find another option before your effective date. The other important part is once you're approved, this locks in your rate based on your age right now — so it's never going to jump because of your health later on."},
    {t:"say", if:()=>aepRoute()==="in",
      text:"Step 2 is its own appointment, because I have to run your doctors and your medications against every plan in your zip code and that takes a good amount of time. So we'll get that booked within 48 hours of today… okay?"},
    {t:"warn", if:()=>aepRoute()==="outside",
      text:"<b>Book the October appointment on the calendar before the call ends.</b> “Call me in October” is not an appointment."},
    {t:"warn", if:()=>aepRoute()==="in",
      text:"<b>Book the follow-up live, inside 48 hours.</b> Get the full doctor list, prescriptions with dosages, and preferred pharmacy before you hang up — without them you have nothing to run."},
    {t:"say", text:"I'll handle the entire enrollment process for you. It's only a few quick health questions and we should be able to get everything wrapped up in the next few minutes."},
    {t:"say", text:"Now let me get everything pulled up for us. And what's a good address to send policy packets and information to?"},
    {t:"do", text:"Handle objections and <b>always end with a pre-emptive close.</b>"}
  ]},

{ id:"m4a-ca", sec:"Close", title:"Advantage — California, 65 or older",
  sub:"No ancillary. The deliverable on this call is the appointment and their details.",
  skip:()=> !isOnMedicare() || !onMA() || !caRestricted(),
  blocks:[
    {t:"cablock"},
    {t:"do", text:"Gold / Silver / Bronze is cancer, heart attack and stroke cover, so it <b>cannot be sold</b> here."},
    {t:"aep"},
    {t:"say", if:()=>aepRoute()==="outside",
      text:"So here's my honest recommendation. Your plan is locked until October 15th, so there's nothing for you to buy today and I'm not going to invent something. What I want is a spot on the calendar in October."},
    {t:"say", if:()=>aepRoute()==="outside",
      text:"In September {carrier} mails you a book called the <b>Annual Notice of Change</b>. It tells you what's changing about your copays and your drug list for next year. Almost nobody reads it. I read it for you, and I compare your plan against everything else in your zip code."},
    {t:"say", if:()=>aepRoute()==="outside", text:"<b>Two steps.</b>"},
    {t:"threesteps", if:()=>aepRoute()==="outside"},
    {t:"say", if:()=>aepRoute()==="outside",
      text:"Before we hang up, let me confirm your doctors, your prescriptions, and a good street address so I'm ready to go in October."},
    {t:"warn", if:()=>aepRoute()==="outside",
      text:"<b>Book the appointment live.</b> Confirm doctors, prescriptions and pharmacy in the CRM — that is the deliverable on this call."},
    {t:"say", if:()=>aepRoute()==="in",
      text:"Good timing. We're in the window where I can actually make a change for you, so let's go ahead and review your plan."},
    {t:"do", if:()=>aepRoute()==="in", text:"Go directly into plan comparison and enrollment."},
    {t:"do", text:"Handle objections and <b>always end with a pre-emptive close.</b>"}
  ]},

/* ========== BRANCH 4B — MEDICARE SUPPLEMENT ========== */
{ id:"m4b-premium", sec:"CNA", title:"Supplement — what they pay now",
  skip:()=> !isOnMedicare() || !onSupp(),
  blocks:[
    {t:"say", text:"What are you paying for that right now on a month to month basis?"},
    {t:"field", k:"currentPremium", label:"Monthly premium", ph:"$", w:"sm"},
    {t:"fields", items:[
      {k:"planType", label:"Plan letter (if they know it)", ph:"G, N, F…", w:"sm"}
    ]}
  ]},

{ id:"m4b-education", sec:"Education", title:"Supplement — federal standardization",
  sub:"The whole pitch: identical coverage by law, so the only difference is price.",
  skip:()=> !isOnMedicare() || !onSupp(),
  blocks:[
    {t:"say", text:"And {name}, are you familiar with Medicare Supplements being federally regulated?"},
    {t:"do", text:"Wait for the response."},
    {t:"say", text:"So Medicare Supplements are federally regulated. That means a Plan G with {carrier} and a Plan G with any other company in the country cover the <b>exact same things</b>, because the government requires them to. So no matter which insurance carrier you go with, your coverage will be the same."},
    {t:"say", text:"Does that make sense so far?"},
    {t:"do", text:"Wait for the response."},
    {t:"say", text:"So if the coverage is identical by law, then the only thing that's actually different between one company and the next is <b>the price</b>, and how often that company raises rates on their people. That's it."},
    {t:"fields", items:[
      {k:"newCarrier", label:"Carrier you'd move them to", ph:"Appointed company", w:"md"},
      {k:"newPrice",   label:"Their price / mo",           ph:"$", w:"sm"}
    ]},
    {t:"saving"},
    {t:"say", text:"Which means when I go shop this for you, I'm not asking you to give up a single thing. Same coverage, same doctors, same benefits — different price. And looking at it right now, we could get you the same coverage with <b>{newCarrier}</b> for <b>{newPrice}</b> per month. How does that sound?"},
    {t:"say", text:"Now here's the one catch. Because you're past your original open enrollment window, moving to a lower priced plan goes through <b>underwriting</b>, which is just a handful of health questions."},
    {t:"say", text:"So here's what I always recommend — we put the application in and we see what happens. If you're approved, you're paying less every single month for the exact same coverage, and we cancel the old policy. If you're not approved, absolutely nothing happens. Your coverage with {carrier} stays exactly where it is."},
    {t:"say", text:"There's <b>no version of this where you end up worse off</b>. The only thing you lose by not applying is the money you're overpaying. Fair enough?"},
    {t:"do", text:"Wait for the response."}
  ]},

{ id:"m4b-umbrella", sec:"Education", title:"Supplement — non-approved expenses",
  skip:()=> !isOnMedicare() || !onSupp() || caRestricted(),
  blocks:[
    {t:"say", text:"Now that's the medical side. Something I do want you to know before we continue is that even with a supplement you are exposed to <b>non-approved Medicare expenses</b>… are you familiar with that?"},
    {t:"say", text:"Your supplement is the best medical coverage on the market, I'll say that all day. If Medicare approves it, your plan pays it. But god forbid you have a bad health year, and have to deal with some critical illnesses or recover in a facility or the comfort of your own home — that is where the non-approved expenses start to creep in. <span class='q'>Is that going to be a concern for you?</span>"},
    {t:"bullets", title:"Examples of non-approved expenses", items:[
      "Custodial care in a nursing home — <b>$6,000 per month</b>",
      "A medical professional for recovering at home — <b>$5,000 per month</b>",
      "Eliquis, after a stroke — <b>$500 per month</b>",
      "Keytruda, for cancer — <b>$10,000 per dose</b>",
      "Opdivo, for cancer — <b>$10,000 per dose</b>"
    ]},
    {t:"choice", k:"chsConcern", label:"Is that a concern for them?", opts:[
      {v:"yes", l:"Yes — committed"},{v:"no", l:"No"}
    ]},
    {t:"say", text:"So the supplement handles the medical bills, and then what we call <b>umbrella coverage</b> covers those non-approved expenses."}
  ]},

{ id:"m4b-tiers", sec:"Education", title:"Supplement — Gold, Silver, Bronze",
  skip:()=> !isOnMedicare() || !onSupp() || caRestricted(),
  blocks:[
    {t:"say", text:"Now {name}, I want you to write down Gold, Silver and Bronze, and let me know once you've got that down."},
    {t:"do", text:"<b>Wait for confirmation before every tier.</b> One at a time."},
    {t:"say", text:"Awesome, so next to Gold I want you to put <b>$30,000 for Cancer</b> and <b>$30,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$60,000</b>. That will be <b>$150 per month</b>. Let me know once you got that."},
    {t:"say", text:"Perfect, now next to Silver I want you to put <b>$20,000 for Cancer</b> and <b>$20,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$40,000</b>. That will be <b>$100 per month</b>. Let me know once you got that."},
    {t:"say", text:"Finally, next to Bronze I want you to put <b>$10,000 for Cancer</b> and <b>$10,000 for Heart Attack and Stroke</b>, for a total benefit of <b>$20,000</b>. That will be <b>$50 per month</b>. Let me know once you got that."},
    {t:"say", text:"Awesome, so based on these prices, which option do you feel like you can comfortably afford on top of your current supplement plan — because we don't know if we can get you approved for that new supplement price just yet?"},
    {t:"do", text:"<b>Ask, then stop talking.</b>"},
    {t:"choice", k:"chsChoice", label:"What did they choose?", opts:[
      {v:"gold",   l:"Gold — $150/mo",  sub:"$60,000 total benefit"},
      {v:"silver", l:"Silver — $100/mo",sub:"$40,000 total benefit"},
      {v:"bronze", l:"Bronze — $50/mo", sub:"$20,000 total benefit"},
      {v:"none",   l:"Objection / not yet"}
    ]},
    {t:"chsTiers"}
  ]},

{ id:"m4b-close", sec:"Close", title:"Supplement — the 3 step close",
  skip:()=> !isOnMedicare() || !onSupp() || caRestricted(),
  blocks:[
    {t:"readback"},
    {t:"say", text:"Based on everything you shared today — <i>(read back your notes)</i> — my formal recommendation is the <b>{tierName}</b> umbrella at <b>{tierPrice}</b> a month, and submitting the Medicare Supplement application with <b>{newCarrier}</b> to qualify you for that lower price."},
    {t:"do", text:"<b>PAUSE. The first one to talk loses.</b>"},
    {t:"say", text:"Do you still have that piece of paper? Perfect — write this down, because this is how we get everything done in three simple steps."},
    {t:"threesteps"},
    {t:"say", text:"<b>Step 1 and 2 we can knock out today.</b>"},
    {t:"say", text:"The reason we handle step 1 and 2 today is because both of these go through underwriting, and I want to know where you stand."},
    {t:"say", text:"And I want to be very clear on step 3, because this is where people get nervous. <b>You do not cancel anything today.</b> You do not cancel anything until the new plan is approved and active."},
    {t:"say", text:"I'll handle the entire enrollment process for you. It's only a few quick health questions and we should be able to get everything wrapped up in the next few minutes."},
    {t:"say", text:"Now let me get everything pulled up for us. And what's a good address to send policy packets and information to?"},
    {t:"do", text:"Handle objections and <b>always end with a pre-emptive close.</b>"}
  ]},

{ id:"m4b-ca", sec:"Close", title:"Supplement — California, 65 or older",
  sub:"No ancillary. The supplement itself is the sale.",
  skip:()=> !isOnMedicare() || !onSupp() || !caRestricted(),
  blocks:[
    {t:"cablock"},
    {t:"do", text:"Do not present Gold, Silver or Bronze. The supplement move <b>is</b> the sale on this call."},
    {t:"readback"},
    {t:"say", text:"So {name}, based on what you're paying now and what I'm seeing on my end, my recommendation is straightforward. <b>Two steps</b> — write them down."},
    {t:"threesteps"},
    {t:"say", text:"The reason we do this today instead of thinking about it is that this goes through underwriting, and <b>underwriting only gets harder as time goes on</b>. Your health today is the best it's going to be for this application. Every month you wait is a month you're overpaying, and a month of health history that can get in the way."},
    {t:"say", text:"And to be very clear — <b>you do not cancel anything today.</b> Not until the new plan is approved and active. You are never without coverage for a single day."},
    {t:"say", text:"I'll handle the entire enrollment process for you. It's only a few quick health questions and we should be able to get everything wrapped up in the next few minutes."},
    {t:"say", text:"Now let me get everything pulled up for us. And what was going to be a good street address for you, so I make sure you receive your packages and cards?"},
    {t:"do", text:"Handle objections and <b>always end with a pre-emptive close.</b>"}
  ]},

{ id:"m4-details", sec:"Close", title:"Already on Medicare — details & outcome",
  skip:()=> !isOnMedicare(),
  blocks:[
    {t:"field", k:"address", label:"Street address", type:"textarea", ph:"Street, city, state, zip", w:"lg"},
    {t:"fields", items:[
      {k:"phone", label:"Best phone", ph:"", w:"md"},
      {k:"email", label:"Email",      ph:"", w:"md"}
    ]},
    {t:"field", if:()=>onMA() && (caRestricted() || aepRoute()==="outside"),
      k:"octDate", label:"October review — week of", ph:"e.g. October 20", w:"md",
      hint:"Just the date — the script already says “the week of”. Book it live; “call me in October” is not an appointment."},
    {t:"field", if:()=>onMA() && !caRestricted() && aepRoute()==="in",
      k:"followUp48", label:"48-hour review — booked for", ph:"Date and time", w:"md"},
    {t:"field", if:()=>onMA() && aepRoute()==="in" || (onMA() && caRestricted()),
      k:"doctorsRx", label:"Doctors, prescriptions with dosages, preferred pharmacy", type:"textarea",
      ph:"Without these you have nothing to run against the plans.", w:"lg"},
    {t:"field", if:()=>onSupp() || (onMA() && aepRoute()==="in"),
      k:"effectiveDate", label:"Effective date", type:"mdy", w:"md"},
    {t:"choice", k:"outcome", label:"Call outcome", opts:[
      {v:"app",      l:"Application submitted"},
      {v:"umbonly",  l:"Umbrella only today"},
      {v:"appt",     l:"Appointment booked"},
      {v:"followup", l:"Follow-up scheduled"},
      {v:"no",       l:"No sale"}
    ]},
    {t:"field", k:"followUp", label:"Follow-up / next action", type:"textarea", ph:"Date, time, what you owe them.", w:"lg"}
  ]},

/* ================= 5. MEDICARE EDUCATION — T65 only ================= */
{ id:"med-enroll", sec:"Education", title:"How you get onto Medicare",
  skip:()=> !isT65(),
  blocks:[
    {t:"say", if:()=>avatar()==="t65ss",

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const $ = s => document.querySelector(s);
const skipped = st => typeof st.skip === "function" && st.skip();
const live = () => STEPS.filter(s=>!skipped(s));
const SECTIONS = ["Opening","CNA","Education","Plans","Pricing","Close"];

function clampStep(){
  if(S.step<0) S.step=0;
  if(S.step>=STEPS.length) S.step=STEPS.length-1;
  let i=S.step;
  while(i<STEPS.length && skipped(STEPS[i])) i++;
  if(i>=STEPS.length){ i=S.step; while(i>=0 && skipped(STEPS[i])) i--; }
  S.step = Math.max(0,i);
}
function go(dir){
  let i = S.step + dir;
  while(i>=0 && i<STEPS.length && skipped(STEPS[i])) i += dir;
  if(i<0 || i>=STEPS.length) return;
  S.step = i; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function jumpSection(sec){
  const i = STEPS.findIndex(s=>s.sec===sec && !skipped(s));
  if(i>=0){ S.step=i; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
}

let TPL = [];   // templates for live re-fill while typing

function txt(v){ return typeof v==="function" ? v() : v; }

function renderBlock(b){
  if(b.if && !b.if()) return "";
  const id = TPL.length;
  switch(b.t){
    case "say":   TPL.push(b.text); return '<div class="b say" data-tpl="'+id+'">'+fill(txt(b.text))+"</div>";
    case "do":    TPL.push(b.text); return '<div class="b do"><span class="ic">▸</span><span data-tpl="'+id+'">'+fill(txt(b.text))+"</span></div>";
    case "warn":  TPL.push(b.text); return '<div class="b warn"><span class="ic">⚠</span><span data-tpl="'+id+'">'+fill(txt(b.text))+"</span></div>";
    case "info":  TPL.push(b.text); return '<div class="b info" data-tpl="'+id+'">'+fill(txt(b.text))+"</div>";
    case "bullets": return '<div class="b bul">'+(b.title?"<h4>"+esc(b.title)+"</h4>":"")+
                    "<ul>"+b.items.map(i=>"<li>"+fill(i)+"</li>").join("")+"</ul></div>";
    case "field":  return '<div class="b frow">'+fieldHTML(b)+"</div>";
    case "fields": return '<div class="b frow">'+b.items.map(fieldHTML).join("")+"</div>";
    case "choice": return choiceHTML(b);
    case "goals":  return goalsHTML();
    case "umbrella":  return '<div class="b">'+umbrellaHTML(false)+"</div>";
    case "pricing":   return pricingHTML();
    case "chsTiers":  return chsTiersHTML();
    case "threesteps":return threeStepsHTML();
    case "readback":  return readbackHTML();
    case "avatarcard":return avatarCardHTML();
    case "aep":       return aepHTML();
    case "saving":    return savingHTML();
    case "cablock":   return caNoticeHTML();
    case "summary":   return summaryHTML();
    default: return "";
  }
}
const SELECTS = {
  aepOverride:[
    {v:"",        l:"Auto — from today's date and their answers"},
    {v:"outside", l:"Outside AEP"},
    {v:"in",      l:"In AEP / verified SEP"}
  ],
  currentPlanKind:[
    {v:"",     l:"Not established yet"},
    {v:"ma",   l:"Medicare Advantage"},
    {v:"supp", l:"Medicare Supplement"}
  ],
  avatarOverride:[
    {v:"",         l:"Auto — decided by their answers"},
    {v:"employer", l:"Employer coverage"},
    {v:"t65noss",  l:"T65 — not on Social Security"},
    {v:"t65ss",    l:"T65 — on Social Security"},
    {v:"medicare", l:"Currently on Medicare"}
  ]
};
function fieldHTML(f){
  const v = esc(A(f.k)), type = f.type||"text";
  f = {...f, ph: typeof f.ph==="function" ? f.ph() : f.ph};
  const w = f.w||"";
  let inner;
  if(type==="textarea"){
    inner = '<textarea data-k="'+f.k+'" placeholder="'+esc(f.ph||"")+'">'+v+"</textarea>";
  } else if(type==="select"){
    const opts = f.opts || SELECTS[f.k] || [];
    inner = '<select data-k="'+f.k+'">'+opts.map(o=>
      '<option value="'+esc(o.v)+'"'+(A(f.k)===o.v?" selected":"")+">"+esc(o.l)+"</option>").join("")+"</select>";
  } else if(type==="mdy"){
    const st = dateStatus(f.k);
    inner = '<input data-k="'+f.k+'" data-mdy type="text" inputmode="numeric" autocomplete="off" '+
      'class="'+(st.state==="ok"||st.state==="empty"?"":"bad")+'" '+   /* not focused yet */
      'value="'+esc(displayMDY(A(f.k)))+'" placeholder="mm/dd/yyyy">';
    return '<div class="f '+w+'"><label>'+esc(f.label)+"</label>"+inner+
           '<div class="hint'+(st.msg?" bad":"")+'" data-msgfor="'+f.k+'">'+
             esc(st.msg || (typeof f.hint==="function" ? f.hint() : f.hint) || "")+"</div></div>";
  } else {
    inner = '<input data-k="'+f.k+'" type="'+type+'" value="'+v+'" placeholder="'+esc(f.ph||"")+'">';
  }
  const hint = typeof f.hint==="function" ? f.hint() : f.hint;
  return '<div class="f '+w+'"><label>'+esc(f.label)+"</label>"+inner+
         (hint?'<div class="hint" data-hintfor="'+f.k+'">'+esc(hint)+"</div>":"")+"</div>";
}
function choiceHTML(c){
  const cur = A(c.k);
  return '<div class="b choice"><span class="clab">'+esc(c.label||"")+"</span><div class=\"opts\">"+
    c.opts.map(o=>{
      const on = cur===o.v ? " on":"";
      return '<label class="opt'+on+'" data-choice="'+c.k+'" data-v="'+esc(o.v)+'">'+
        '<span class="box"></span><span>'+esc(o.l)+
        (o.sub?'<span class="sub">'+esc(o.sub)+"</span>":"")+"</span></label>";
    }).join("")+"</div></div>";
}

/* ---- goals ---- */
function goalsHTML(){
  const gs = S.goals.map((g,i)=>
    '<div class="g"><span class="num">'+(i+1)+'</span><span class="txt">'+esc(g)+
    '</span><button class="x" data-delgoal="'+i+'" title="Remove">×</button></div>').join("");
  return '<div class="b goals">'+(gs||'<div class="empty" style="margin-bottom:8px">No goals captured yet.</div>')+
    '<div class="addrow"><input id="goalIn" placeholder="Type what they said, then press Enter">'+
    '<button class="btn" id="goalAdd">Add goal</button></div></div>';
}

/* ---- umbrella ---- */
function aepHTML(){
  const route = aepRoute(), auto = aepAuto();
  const on = route==="in";
  return '<div class="b umb"><div class="umb-h">Timing — '+
    (on ? "in AEP or verified SEP" : "outside AEP")+'</div><div class="umb-b">'+
    '<div class="big" style="font-size:19px">'+(on
      ? "You can change their plan"
      : "Locked in until October 15")+"</div>"+
    '<div style="font-size:13px;color:var(--ink-3);margin-top:6px">'+esc(aepWhy())+"</div>"+
    (on && !inAEPWindow(new Date())
      ? '<div class="b warn" style="margin:10px 0 0"><span class="ic">⚠</span><span>Outside the AEP dates — this route depends on a special enrollment period. <b>Verify it before you promise anything.</b></span></div>'
      : "")+
    '<div class="frow" style="margin-top:12px">'+
      fieldHTML({k:"aepOverride",label:"Route",type:"select",w:"md"})+"</div>"+
    (A("aepOverride") && A("aepOverride")!==auto && !sepAnyYes()
      ? '<div class="b do" style="margin:10px 0 0"><span class="ic">▸</span><span>Set by hand — today\'s date says <b>'+
        (auto==="in"?"in AEP":"outside AEP")+"</b>.</span></div>" : "")+
    "</div></div>";
}
/* What the supplement move is actually worth to them each month. */
function savingHTML(){
  const now = num(A("currentPremium")), then = num(A("newPrice"));
  if(!now || !then) return "";
  const diff = now - then;
  if(diff <= 0) return '<div class="b do"><span class="ic">▸</span><span>That quote is <b>not</b> cheaper than what they pay now — check the numbers before you say it out loud.</span></div>';
  return '<div class="b umb"><div class="umb-h">What the move is worth</div><div class="umb-b">'+
    '<table class="utab"><tr><td>Paying '+esc(A("carrier")||"now")+"</td><td>"+money(now)+"/mo</td></tr>"+
    "<tr><td>"+esc(A("newCarrier")||"New carrier")+"</td><td>"+money(then)+"/mo</td></tr>"+
    '<tr class="tot"><td>They save</td><td>'+money(diff)+"/mo</td></tr></table>"+
    '<div class="big" style="margin-top:8px">'+money(diff*12)+'<small> a year, same coverage</small></div>'+
    "</div></div>";
}
function caNoticeHTML(){
  if(!caRestricted()) return "";
  return '<div class="b stopcard"><div class="stopcard-h">⛔ California — restricted products</div>'+
    '<div class="stopcard-b"><p><b>'+esc(clientState())+', age '+age()+'.</b> '+
    "Cancer, heart attack and stroke coverage and skilled nursing coverage <b>cannot be sold</b> on this call — "+
    "so the exposure conversations are skipped rather than embedded.</p>"+
    (isT65()
      ? "<p><b>Dental can still be sold.</b> Ask whether it matters to them; it still prices into the Supplement umbrella at $50.</p>"
      : isOnMedicare()
        ? "<p>Gold, Silver and Bronze cannot be presented. "+
          (onSupp() ? "The supplement move itself is the sale on this call."
            : "Book the October review — that appointment is the deliverable.")+"</p>"
        : "<p>Gold, Silver and Bronze cannot be presented, and there is no Medicare plan to offer in its place.</p>")+
    '<p class="fine">Driven by the zip and date of birth you captured. If either is wrong, correct it and this clears.</p>'+
    "</div></div>";
}
function umbrellaHTML(compact){
  const s = umbrella("supp"), m = umbrella("ma");
  const rows = (u,kind) => u.rows.map(r=>{
    if(r.blocked)
      return '<tr class="off"><td><s>'+esc(r.label)+"</s> <span style=\"opacity:.75\">(can't be sold in CA at 65+)</span></td><td>—</td></tr>";
    const on = r.on && r.amt>0;
    const amt = r.amt===0 ? (r.on?"included":"—") : (on ? "+"+money(r.amt) : money(0));
    return '<tr class="'+(on?"":"off")+'"><td>'+(on?"✓ ":"○ ")+esc(r.label)+
      (r.note&&r.on?' <span style="opacity:.7">('+esc(r.note)+")</span>":"")+"</td><td>"+amt+"</td></tr>";
  }).join("") + '<tr class="tot"><td>'+kind+' umbrella</td><td>'+money(u.value)+
    (u.overridden?' <span style="font-size:11px;font-weight:600;opacity:.7">override</span>':"")+"</td></tr>";
  return '<div class="umb"><div class="umb-h">Umbrella — priced from the needs assessment'+
    (caRestricted()?" · dental only":"")+'</div><div class="umb-b">'+
    '<div class="ucols">'+
      '<div class="ucol"><h5>Medicare Supplement</h5><table class="utab">'+rows(s,"Supplement")+"</table></div>"+
      '<div class="ucol"><h5>Medicare Advantage</h5><table class="utab">'+rows(m,"Advantage")+"</table></div>"+
    "</div>"+
    (compact||caRestricted()?"":'<div class="frow" style="margin-top:14px">'+
      fieldHTML({k:"umbSuppOverride",label:"Override Supplement umbrella",ph:money(s.total),w:"sm"})+
      fieldHTML({k:"umbMaOverride",  label:"Override Advantage umbrella", ph:money(m.total),w:"sm"})+

/* ---- 3 steps ---- */
function threeStepsHTML(){
  const av = avatar(), blocked = caRestricted();

    ? "<b>"+money({gold:150,silver:100,bronze:50}[A("chsChoice")])+"</b>" : ph("tier price");
  const carrier = A("carrier") ? "<b>"+esc(A("carrier"))+"</b>" : ph("carrier");
  const eff  = A("effectiveDate") ? "<b>"+esc(displayMDY(A("effectiveDate")))+"</b>" : ph("effective date");
  const oct  = A("octDate") ? "<b>"+esc(A("octDate"))+"</b>" : ph("October date");
  const newC = A("newCarrier") ? "<b>"+esc(A("newCarrier"))+"</b>" : ph("new carrier");

  let title, steps;

  /* ---- already on Medicare: four shapes ---- */
  if(av==="medicare"){
    if(onSupp()){
      if(blocked){
        title = "📋 Supplement · California — 2 steps";
        steps = ["We put in the application today to see if we can get you the exact same coverage for less than you're paying "+carrier+".",
                 "Your new coverage goes into effect on "+eff+" — and that's the day, and only that day, we cancel the old policy."];
      } else {

                 "Your new coverage goes into effect on "+eff+" — and that's the day we cancel the old policy, if you are approved for the new one."];
      }
    } else {
      const outside = aepRoute()==="outside";
      if(blocked){
        title = outside ? "📋 Advantage · California — 2 steps" : "📋 Advantage · California — in AEP";
        steps = outside
          ? ["We get your review scheduled for the week of October "+oct+".",
             "Any changes we make go into effect January 1st."]
          : ["Go straight into the plan comparison and enrollment — no separate steps to write down."];
      } else if(outside){
        title = "📋 Advantage · outside AEP — 2 steps";
        steps = ["We get your umbrella coverage set up for "+tier+" a month, today.",
                 "We put a date on the calendar in October to review your "+carrier+" plan for next year."];
      } else {
        title = "📋 Advantage · in AEP or verified SEP — 3 steps";
        steps = ["We get your umbrella coverage set up for "+tier+" a month.",
                 "We get back together within 48 hours and do a full review of your "+carrier+" plan.",

  const plan  = A("leaning")==="supp" ? "Supplement" : A("leaning")==="ma" ? "Advantage" : ph("Supplement / Advantage");

  const umbStep = "We get your "+(blocked?"dental ":"")+"umbrella coverage set up for <b>"+price+"</b> a month.";
  if(av==="t65noss"){
    title = "📋 Scenario A — T65, not on Social Security";

             "We manually enroll you into Original Medicare Parts A &amp; B three months before your birth month of "+bm+" — it takes about 10 minutes.",
             "We enroll you into your <b>"+plan+"</b> plan "+lead+" before your 65th birthday."];
  } else {
    title = "📋 Scenario B — T65, on Social Security";
    steps = [umbStep,
             "Since you're on Social Security you'll be automatically enrolled into Parts A &amp; B — we just confirm that's all set.",
             "We enroll you into your <b>"+plan+"</b> plan "+lead+" before your 65th birthday."];

    (noUmb?'<div class="b warn" style="margin:0 0 10px"><span class="ic">⚠</span><span>'+

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  clampStep();
  const st = STEPS[S.step];
  TPL = [];
  /* Replacing the step's markup destroys whatever the agent was focused on.
     A blur fires change, which lands here — so clicking straight from one
     field into the next would otherwise swallow the click. Remember where
     focus is and put it back. */
  const act = document.activeElement;
  const keepK = act && act.dataset ? (act.dataset.k || null) : null;
  const keepId = act && act.id ? act.id : null;
  const keepPos = act && typeof act.selectionStart === "number" ? act.selectionStart : null;

  $("#secLabel").textContent = st.sec;
  $("#stepTitle").textContent = st.title;
  const sub = $("#stepSub");
  const subTxt = typeof st.sub==="function" ? st.sub() : st.sub;
  sub.innerHTML = subTxt ? esc(subTxt) : "";
  sub.style.display = subTxt ? "" : "none";

  $("#blocks").innerHTML = st.blocks.map(renderBlock).join("");

  const L = live(), idx = L.indexOf(st);
  $("#stepCount").textContent = "Step " + (idx+1) + " of " + L.length;
  $("#pbar").style.width = ((idx+1)/L.length*100).toFixed(1) + "%";
  $("#btnBack").disabled = idx<=0;
  $("#btnNext").disabled = idx>=L.length-1;
  $("#btnNext").textContent = idx>=L.length-1 ? "End of script" : "Next →";

  renderAvatarChip();
  renderStepsRail(st);
  renderRail();
  syncSaveBtn();

  if(keepK || keepId){
    const again = document.querySelector(
      keepK ? '#blocks [data-k="'+keepK+'"]' : "#"+keepId);
    if(again){
      again.focus();
      if(keepPos!=null){ try{ again.setSelectionRange(keepPos,keepPos); }catch(e){} }
    }
  }
}

      ? "Employer track — Gold / Silver / Bronze."
      : (onSupp() ? "Supplement branch — Gold / Silver / Bronze."
        : onMA()  ? "Advantage branch — Gold / Silver / Bronze."
                  : "Gold / Silver / Bronze once the branch is set.");
    box.innerHTML =
      '<div class="empty" style="margin-bottom:8px">'+lead+"</div>"+
      (map[pick] ? '<div class="big">'+map[pick][1]+'<small> /mo · '+map[pick][0]+"</small></div>"
                 : (pick==="none" ? '<div class="empty">Objection — nothing chosen yet.</div>' : ""));
  } else {
    const s=umbrella("supp"), m=umbrella("ma");
    const drivers=[];
    if(A("chsConcern")==="yes") drivers.push("Cancer/HA/stroke");
    if(A("snfConcern")==="yes") drivers.push("Skilled nursing");
    if(A("dentalImport")==="yes") drivers.push("Dental (supp only)");
    box.innerHTML =
      '<div class="kv"><span class="k">Supplement</span><span class="v">'+money(s.value)+"/mo</span></div>"+
      '<div class="kv"><span class="k">Advantage</span><span class="v">'+money(m.value)+"/mo</span></div>"+
      (drivers.length
        ? '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-3)">Driven by: '+esc(drivers.join(" · "))+"</div>"
        : '<div class="empty" style="margin-top:8px">No concerns flagged yet.</div>')+
      (A("planGPremium")||A("mapdPremium")
        ? '<div class="kv" style="margin-top:8px"><span class="k">Supp all-in</span><span class="v">'+money(suppTotal())+
          '/mo</span></div><div class="kv"><span class="k">MA all-in</span><span class="v">'+money(maTotal())+"/mo</span></div>"
        : "");
  }

  $("#railGoals").innerHTML = S.goals.length
    ? S.goals.map((g,i)=>'<div class="railgoal"><span class="n">'+(i+1)+'.</span><span>'+esc(g)+"</span></div>").join("")
    : '<div class="empty">Captured in the opening.</div>';

  const sc = $("#scratch");
  if(sc && document.activeElement!==sc) sc.value = S.scratch;
}

/* live re-fill of script text while the agent types */
function refill(){
  document.querySelectorAll("[data-tpl]").forEach(el=>{
    const t = TPL[+el.getAttribute("data-tpl")];
    if(t!=null) el.innerHTML = fill(txt(t));
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
/* Rewrite the field to mm/dd/yyyy and put the caret back where the agent
   left it — counted in digits, so the inserted slashes don't shift it. */
/* `how` distinguishes the three ways text arrives, because only two of them
   mean a separator: a paste, and the agent typing "/" themselves. A plain
   digit edit is read as digits alone — so surgery in the middle of a finished
   date produces an obviously broken value the agent can see, never a
   plausible wrong one that reads as real. */
function maskDate(el, how){
  const caret = el.selectionStart;
  const atEnd = caret === el.value.length;
  const digitsBefore = (el.value.slice(0,caret).match(/\d/g)||[]).length;
  const digits = (how.pasted || how.typedSep) ? normalizeTyped(el.value) : digitsOf(el.value);
  const out = formatMDY(digits, !how.deleting);
  if(out === el.value) return out;
  el.value = out;
  if(atEnd){ el.setSelectionRange(out.length,out.length); return out; }
  let pos = 0, seen = 0;
  while(pos<out.length && seen<digitsBefore){ if(/\d/.test(out[pos])) seen++; pos++; }
  if(out[pos]==="/" && seen===digitsBefore && digitsBefore>0 && digitsBefore<8) pos++;
  el.setSelectionRange(pos,pos);
  return out;
}
function paintDate(el){
  const st = dateStatus(el.dataset.k);
  const bad = st.state==="invalid" ||
              (st.state==="incomplete" && document.activeElement!==el);
  el.classList.toggle("bad", bad);
  const msg = document.querySelector('[data-msgfor="'+el.dataset.k+'"]');
  if(msg){ msg.textContent = st.msg; msg.classList.toggle("bad", !!st.msg); }
}

$("#blocks").addEventListener("input", e=>{
  const el = e.target;
  if(!el.dataset.k) return;
  if(el.dataset.mdy!==undefined){
    const before = A(el.dataset.k), it = e.inputType||"";
    maskDate(el, {
      deleting : it.startsWith("delete"),
      pasted   : it==="insertFromPaste" || it==="insertFromDrop" || it==="",
      typedSep : it==="insertText" && /^[\/\-. ]$/.test(e.data||"")
    });
    set(el.dataset.k, el.value);
    paintDate(el);
    /* A finished date can switch the California rule on or off, so redraw the
       whole step — then hand focus straight back to the agent. */
    if(dateStatus(el.dataset.k).state==="ok" && el.value!==before){
      const k = el.dataset.k;
      render();
      const again = document.querySelector('[data-k="'+k+'"]');
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      return;
    }
    refill(); renderRail(); return;
  }
  if(el.dataset.k==="stateManual" || el.dataset.k==="zip"){
    const wasRestricted = caRestricted();
    applyZipOrState(el);
    repaintZipArea(el);
    if(caRestricted() !== wasRestricted) render();   // render() puts focus back
    return;
  }
  set(el.dataset.k, el.value);
  refill(); renderRail();
});

/* Apply an edit to either half of the zip/state pair. */
function applyZipOrState(el){
  if(el.dataset.k==="stateManual"){
    /* Typing here takes ownership; clearing it hands control back to the zip. */
    set("stateManual", el.value.trim().toUpperCase());
    set("stateEdited", el.value.trim() ? "1" : "");
    if(!el.value.trim()) syncStateToZip();
  } else {
    set("zip", el.value);
    syncStateToZip();
  }
}
/* Update the state box and its hint in place — no redraw, so the agent keeps
   their cursor and any click already in flight still lands. */
function repaintZipArea(source){
  const stateBox = document.querySelector('[data-k="stateManual"]');
  if(stateBox && stateBox !== source) stateBox.value = A("stateManual");
  const hint = document.querySelector('[data-hintfor="stateManual"]');
  if(hint){
    const st = clientState();
    hint.textContent = !st ? "Fills in from the zip code."
      : (stateName(st)||st) + (A("stateEdited")==="1" ? " — entered by hand" : " — from the zip");
  }
  refill(); renderRail();
}
$("#blocks").addEventListener("change", e=>{
  const el = e.target;
  if(!el.dataset.k) return;
  if(el.dataset.mdy!==undefined && dateStatus(el.dataset.k).state==="ok")
    el.value = displayMDY(el.value);
  const wasRestricted = caRestricted();
  if(el.dataset.k==="stateManual" || el.dataset.k==="zip"){
    applyZipOrState(el);
    repaintZipArea(el);
  } else {
    set(el.dataset.k, el.value);
    refill(); renderRail();
  }
  /* Redraw only when the step's shape can actually change: a select can switch
     the whole route, and the California rule adds and removes blocks. Redrawing
     on every blur would swallow the click that caused the blur. */
  if(el.tagName==="SELECT" || caRestricted() !== wasRestricted) render();
});
$("#blocks").addEventListener("click", e=>{
  const opt = e.target.closest("[data-choice]");
  if(opt){
    e.preventDefault();
    const k = opt.dataset.choice;
    set(k, A(k)===opt.dataset.v ? "" : opt.dataset.v);   // click again to clear
    render(); return;
  }
  const del = e.target.closest("[data-delgoal]");
  if(del){ S.goals.splice(+del.dataset.delgoal,1); save(); render(); return; }
  if(e.target.id==="goalAdd"){ addGoal(); return; }
  if(e.target.id==="umbReset"){ set("umbSuppOverride",""); set("umbMaOverride",""); render(); return; }
  if(e.target.id==="copySum"){ copy(summaryText(), e.target); return; }
  if(e.target.id==="printSum"){ window.print(); return; }
  if(e.target.id==="dlSum"){ download(); return; }
});
$("#blocks").addEventListener("focusout", e=>{
  if(e.target.dataset && e.target.dataset.mdy!==undefined) paintDate(e.target);
}, true);
$("#blocks").addEventListener("keydown", e=>{
  if(e.target.id==="goalIn" && e.key==="Enter"){ e.preventDefault(); addGoal(); }
});
function addGoal(){
  const inp = document.getElementById("goalIn");
  const v = (inp?.value||"").trim();
  if(!v) return;
  S.goals.push(v); save(); render();
  const again = document.getElementById("goalIn"); if(again) again.focus();
}
function copy(text, btn){
  navigator.clipboard?.writeText(text).then(()=>toast("Copied to clipboard"),()=>toast("Copy failed — select the text below"));
}
/* Saving a file works two ways: a plain blob link when this file is opened
   directly, and the host's save prompt when it is published as an artifact.
   If neither is available, the button hides and Copy summary carries the load. */
const hosted = () => !!(window.claude && typeof window.claude.use === "function");
let saver = null, saverReady = false;
if(hosted()){
  window.claude.use("downloads")
    .then(d=>{ saver=d; saverReady=true; syncSaveBtn(); })
    .catch(()=>{ saverReady=true; syncSaveBtn(); });
} else { saverReady = true; }
function syncSaveBtn(){
  const b = document.getElementById("dlSum");
  if(b) b.style.display = (hosted() && saverReady && !saver) ? "none" : "";
}
async function download(){
  const name = (A("clientName")||A("clientFirst")||"client").replace(/[^a-z0-9]+/gi,"_");
  const filename = "mohr_call_"+name+"_"+new Date().toISOString().slice(0,10)+".txt";
  const text = summaryText();
  if(hosted()){
    if(!saver){ toast("Saving files isn't available here — use Copy summary."); return; }
    try{ await saver.save({filename, data:text}); toast("Summary saved"); }
    catch(err){ toast(err && err.code==="declined" ? "Save cancelled" : "Couldn't save — use Copy summary."); }
    return;
  }
  const blob = new Blob([text],{type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1900);
}

$("#btnBack").onclick = ()=>go(-1);
$("#btnNext").onclick = ()=>go(1);
$("#stepsRail").addEventListener("click", e=>{
  const b = e.target.closest("[data-sec]"); if(b) jumpSection(b.dataset.sec);
});
$("#scratch").addEventListener("input", e=>{ S.scratch = e.target.value; save(); });
$("#btnSummary").onclick = ()=>{ S.step = STEPS.length-1; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
$("#btnReset").onclick = ()=>{
  if(!confirm("Start a new call? Everything captured on this one will be cleared.")) return;
  S = structuredClone(BLANK); save(); render(); toast("New call started");
};
$("#btnTheme").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("mohr.theme", next); }catch(e){}
};
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft")  go(-1);
});

try{
  const th = localStorage.getItem("mohr.theme");
  if(th) document.documentElement.setAttribute("data-theme", th);
}catch(e){}
render();
</script>
